schema_version: "1.1.0"
package: "wotex_runtime"
completion_plan: "docs/plans/wotex-runtime-completion.md"
compatibility_decision:
  packet: "WRT-C06"
  status: "candidate"
  contract: "docs/plans/WRT-C06-stable-api.md"
  qualification: "consumer-visible values, callbacks, deliveries, errors, limits and lifecycle defaults for 0.1.0; no exhaustive export or struct-layout freeze"
specifications:
  - id: "WRT.01"
    version: "1.4.0"
    path: "docs/specs/WRT.01-consumed-thing-runtime.md"
    implementation_status: "implemented"
    standards:
      - {name: "W3C WoT Thing Description 1.1", revision: "Recommendation 2023-12-05", claim: "listed operation and Form mechanics only"}
      - {name: "W3C WoT Scripting API", revision: "Note 2023-10-03", claim: "conceptual guidance; no API conformance"}
    requires: ["wotex:WTX.01", "wotex:WTX.02", "wotex:WTX.03"]
    implementation_modules: ["Wotex.Runtime.ConsumedThing", "Wotex.Runtime.FormSelector", "Wotex.Runtime.Context", "Wotex.Runtime.ExecutionContext", "Wotex.Runtime.Selection", "Wotex.Runtime.BindingProfile", "Wotex.Runtime.Request", "Wotex.Runtime.Result", "Wotex.Runtime.Error", "Wotex.Runtime.Credentials", "Wotex.Runtime.Transport", "Wotex.Runtime.Subscription", "Wotex.Runtime.Retry", "Wotex.Runtime.Telemetry", "Wotex.Runtime.PortCall", "Wotex.Runtime.Limits"]
    executable_evidence: ["test/wotex/runtime/consumed_thing_test.exs", "test/wotex/runtime/form_selector_test.exs", "test/wotex/runtime/subscription_test.exs", "test/wotex/runtime/subscription_opening_test.exs", "test/wotex/runtime/value_test.exs", "test/wotex/runtime/retry_test.exs", "test/wotex/runtime/library_contract_test.exs", "test/wotex/runtime/dependency_security_test.exs"]
    compatibility_classification: "explicit admission bounds, Result correlation, sanitized exception telemetry, typed concurrent stop, opening-worker handoff and closed retry admission; protocol SDK ownership and native interoperability remain binding obligations"
  - id: "WRT.02"
    version: "1.1.0"
    path: "docs/specs/WRT.02-exposed-thing-runtime.md"
    implementation_status: "implemented"
    standards:
      - {name: "W3C WoT Thing Description 1.1", revision: "Recommendation 2023-12-05", claim: "affordance vocabulary and declared Thing operations only"}
    requires: ["WRT.01"]
    implementation_modules: ["Wotex.Runtime.ExposedThing"]
    executable_evidence: ["test/wotex/runtime/exposed_thing_test.exs", "test/wotex/runtime/library_contract_test.exs"]
    compatibility_classification: "caller callback API implemented with concurrent/no-invocation negative evidence; inbound protocol authorization remains external"
  - id: "WRT.03"
    version: "1.0.0"
    path: "docs/specs/WRT.03-thing-level-interactions.md"
    implementation_status: "implemented"
    standards:
      - {name: "W3C WoT Thing Description 1.1", revision: "Recommendation 2023-12-05", claim: "nine listed top-level Form operations; not binding-wide support"}
    requires: ["WRT.01", "WRT.02", "wotex:WTX.02"]
    implementation_modules: ["Wotex.Runtime.ConsumedThing", "Wotex.Runtime.ExposedThing", "Wotex.Runtime.FormSelector"]
    executable_evidence: ["test/wotex/runtime/consumed_thing_test.exs", "test/wotex/runtime/exposed_thing_test.exs", "test/wotex/runtime/form_selector_test.exs"]
    compatibility_classification: "aggregate operations are explicit opt-in profile capabilities"
  - id: "WRT.04"
    version: "1.1.0"
    path: "docs/specs/WRT.04-implementation-admission.md"
    implementation_status: "partial"
    standards: []
    requires: ["WRT.01"]
    implementation_modules: ["Wotex.Runtime.Implementation.Descriptor", "Wotex.Runtime.Implementation.Registration", "Wotex.Runtime.Implementation.Verification", "Wotex.Runtime.Implementation.Trust", "Wotex.Runtime.Implementation.Policy", "Wotex.Runtime.Implementation.Inputs", "Wotex.Runtime.Implementation.Admission", "Wotex.Runtime.Implementation.Plan", "Wotex.Runtime.Implementation.InstanceKey", "Wotex.Runtime.Implementation.Error"]
    executable_evidence: ["test/wotex/runtime/implementation_admission_test.exs", "test/wotex/runtime/implementation_boundary_test.exs"]
    compatibility_classification: "closed bounded admission, registration, verification, trust, policy and plan constructors implemented; execution revalidation compares current decision identities; binding pre-spawn integration and target qualification remain planned; receipts do not perform verification"
  - id: "WRT.05"
    version: "1.1.0"
    path: "docs/specs/WRT.05-implementation-lifecycle.md"
    implementation_status: "partial"
    standards: []
    requires: ["WRT.01", "WRT.04"]
    implementation_modules: ["Wotex.Runtime.Implementation.Lifecycle"]
    executable_evidence: ["test/wotex/runtime/implementation_lifecycle_test.exs"]
    compatibility_classification: "pure lifecycle construction, closed events, generation fencing and explicit cleanup outcomes implemented; binding custody, replacement and actual resource-release qualification remain open; no generic process manager"
  - id: "WRT.06"
    version: "1.1.0"
    path: "docs/specs/WRT.06-bounded-codec.md"
    implementation_status: "planned"
    standards: []
    requires: ["WRT.04", "WRT.05"]
    implementation_modules: []
    executable_evidence: []
    compatibility_classification: "unreleased target codec facade, decoder/executor callbacks, Call/Result/Value shapes and bounded process wire profile; no executable codec, WASM binding, interoperability or hardware qualification claimed"
