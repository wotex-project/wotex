    compatibility_classification: "TI ZNP software host slice and Circuits.UART serial adapter implemented with exact version admission, USB identity checks, finite serial owner, simulated independent byte peer, bounded AF request identity/correlation, typed IEEE/node/endpoint descriptor replies, exact one-byte SRSP validation, receiver-side finite command admission and separate indications. Bounded descriptor/Basic interviews preserve partial outcomes under one deadline, caller monitoring and finite route/token retirement. An explicit consumer-owned route ledger adopts complete interviews, quarantines conflicting claims, fences source resolution by epoch/time/sequence and expiry, and guards AF sends at the receiver with custody-bounded deadlines. Startup shares one open/write/version deadline, monitors negotiating callers, redacts callback faults and reports explicit close failure after one attempt. Caller-owned opening keeps its original deadline/monitor through handoff, links before handle delivery and closes on normal or abnormal caller exit. Linked adapter loss follows redacted pending failure and one cleanup attempt. Queued AF dispatch validates delivery context and owner epoch, checks current custody and preserves supplied absolute expiry through mailbox and serial delivery. Explicit Bind/Unbind workflows revalidate current source custody and preserve distinct NCP admission/peer status under one absolute deadline and caller monitor. Exact SDK source resolves both MT targets to a 23-byte payload. A finite 256-pair route/operation retirement table prevents reuse after dispatch or callback observation; raw binding frames remain excluded from ordinary command admission. Timeout/loss and redacted callback faults preserve unconfirmed evidence and end the epoch. Explicit device/network inspection preserves exact SDK metadata, bounded association lists, observation times, changed state and partial readings under one deadline/caller monitor. Ordinary raw query admission remains excluded. Matching sequential metadata does not establish atomicity, credential/counter continuity or commissioning. Explicit local permit-join/closure checks fresh expected coordinator/network metadata and current consumer credential authorization through an opaque port. A finite horizon reserves the requested duration before dispatch. NCP admission remains separate from uncorrelated management responses and local duration indications. Denial, redacted faults and known expiry before the administrative write retain evidence without dispatch; outstanding timeout/loss closes once. Physical macOS/Nerves qualification, resident credential/Trust Center policy, recovery, binding destination qualification and NCP hardware qualification remain open; WZG.01 is not complete. Explicit channel migration uses fresh network metadata, current peer custody and consumer authorization with a settling reservation, one source-pinned broadcast/local-copy request, target-channel readings and per-peer Basic observations with retired tokens. NCP/APS/ZCL results stay separate and missing peers remain partial; any administrative dispatch closes the owner after observation without rollback, retry or reset. Physical migration and installed firmware/update-ID/pacing/delay/security qualification remain open. Explicit key update/switch uses private one-use consumer custody, separate update/switch grants, three fresh metadata phases, reserved distribution/settling delays and per-peer Basic observations under one original deadline. Key bytes stay out of public values, stored owner state and results; callback misuse/faults are redacted. Source resolves the PDF key-width error and preserves possible local key effects after failed sends. Any key-write attempt closes the owner; no retry, rollback or counter reset occurs. Activation remains unconfirmed because Basic responses identify no key. Exact installed firmware, resident security/distribution policy, fresh key/current sequence, SSP counter/switch behavior, physical peer activation and backup/restore remain open."
