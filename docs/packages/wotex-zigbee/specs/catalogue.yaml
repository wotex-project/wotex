    compatibility_classification: "Finite ZCL global attribute codec, ZDO response decoders and a bounded owner-backed descriptor/Basic interview implemented. Revision 8 scalar/string non-values retain null and raw bytes, with explicit caller policy for full-range numeric attributes; unknown widths preserve the opaque remainder. Ordinary writes and send/receive reporting configuration/readback use bounded explicit requests, exact frame budgets and source/header matched per-record outcomes. Ambiguous records, unsupported configurations and Default Responses remain unconfirmed; the consumer owns dispatch, authorization and finite transaction/sequence correlation. The selected Basic client reads are pinned to ZCL revision 8 and preserve per-record failures and duplicate evidence. Consumer-owned raw-IEEE custody supports rejoin, conflict quarantine, epoch replacement, expiry and source observation ordering while preserving security disposition. Consumer-owned downlinks bound global/per-peer counts, payload bytes and finite lifetimes; explicit FIFO selection, expiry, cancellation and rebind retain outcomes without polling, retry or retargeting. The serial receiver enforces selected absolute expiry. Revision 8 finite Poll Control commands preserve exact quartersecond arguments; source-checked Check-in windows and scripted NCP/Default Response evidence do not establish wakefulness or delivery. Consumer-defined reporting and Check-in cadence uses explicit per-stream intervals/grace, on-change/disabled modes, bounded receipts, owner observation time and current source custody. Null retains unavailable data while renewing packet cadence; ambiguous and opaque records do not renew a deadline. Host time/sequence fences, explicit rearming, forgetting and owner rebind preserve bounded history without an offline claim or automatic delivery. Explicit Bind/Unbind workflows select IEEE/endpoint or group targets under current source custody. Exact SDK source resolves fixed-width group padding. NCP admission and matching source/status callbacks stay separate; rejection, expiry and loss retain unconfirmed outcomes without retry. Callback fields omit independent transaction, echoed binding selectors and security disposition, so bounded route/operation retirement prevents reuse within an owner epoch without claiming radio authentication or binding-table truth. Explicit coordinator/network inspection retains raw IEEE, capability/state, association, PAN/extended PAN, parent and channel readings with exact SDK layouts, bounded lists and partial/changed observations. Sequential metadata is not an atomic network image or key/counter continuity. Explicit local joining/closure requests use fresh expected-network metadata and a consumer custody authorization horizon, with duration 0..254 and no private credential material returned. Admission, uncorrelated management responses and local change indications remain separate; no successful enrollment or physical closure is inferred. Network identity continuity, qualified joining/security/closure, restore, qualified battery policy, physical binding destinations, physical key rotation, the adopted Zigbee core revision and physical qualification remain open. Manufacturer semantics remain consumer-owned. Explicit channel migration uses fresh network metadata, current peer custody and consumer authorization with a settling reservation, one source-pinned broadcast/local-copy request, target-channel readings and per-peer Basic observations with retired tokens. NCP/APS/ZCL results stay separate and missing peers remain partial; any administrative dispatch closes the owner after observation without rollback, retry or reset. Physical migration and installed firmware/update-ID/pacing/delay/security qualification remain open. Explicit key update/switch uses private one-use consumer custody, separate update/switch grants, three fresh metadata phases, reserved distribution/settling delays and per-peer Basic observations under one original deadline. Key bytes stay out of public values, stored owner state and results; callback misuse/faults are redacted. Source resolves the PDF key-width error and preserves possible local key effects after failed sends. Any key-write attempt closes the owner; no retry, rollback or counter reset occurs. Activation remains unconfirmed because Basic responses identify no key. Exact installed firmware, resident security/distribution policy, fresh key/current sequence, SSP counter/switch behavior, physical peer activation and backup/restore remain open."
