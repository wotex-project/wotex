schema_version: "1.1.0"
package: "wotex_zigbee"
completion_plan: "docs/plans/wotex-zigbee-completion.md"
specifications:
  - id: "WZG.01"
    version: "0.7.0-target"
    path: "docs/specs/WZG.01-library-contract.md"
    implementation_status: "partial"
    standards: [{name: "TI CC26x2 ZNP Monitor/Test", revision: "SimpleLink CC26x2 SDK 2.30.00.34, SWRA198 revision 1.14", claim: "bounded serial host framing and finite non-administrative command profile; firmware bytes configured by consumer"}]
    requires: []
    implementation_modules: ["Wotex.Zigbee", "Wotex.Zigbee.Command", "Wotex.Zigbee.Config", "Wotex.Zigbee.DataRequest", "Wotex.Zigbee.Error", "Wotex.Zigbee.Event", "Wotex.Zigbee.Frame", "Wotex.Zigbee.Handle", "Wotex.Zigbee.Owner", "Wotex.Zigbee.Interview", "Wotex.Zigbee.Interview.Flow", "Wotex.Zigbee.Interview.Result", "Wotex.Zigbee.Reply", "Wotex.Zigbee.Routes", "Wotex.Zigbee.SerialPort", "Wotex.Zigbee.Serial.CircuitsUART", "Wotex.Zigbee.ZDO"]
    executable_evidence: ["test/wotex/zigbee/startup_test.exs", "test/support/startup_serial.ex", "test/wotex/zigbee/routes_test.exs", "test/wotex/zigbee/routes_owner_test.exs", "test/wotex/zigbee/interview_test.exs", "test/wotex/zigbee/interview_owner_test.exs", "test/wotex/zigbee/command_test.exs", "test/wotex/zigbee/frame_test.exs", "test/wotex/zigbee/owner_test.exs", "test/wotex/zigbee/event_test.exs", "test/wotex/zigbee/zdo_test.exs", "test/wotex/zigbee/circuits_uart_test.exs", "test/wotex/zigbee/data_request_test.exs", "test/support/serial_peer.ex", "test/support/controlled_serial.ex", "test/support/fake_uart.ex", "bench/output/protocol.md", "bin/check_archive.exs", "bin/check_application_free.exs"]
    required_cases: ["WZG1-T1", "WZG1-T2", "WZG1-T3", "WZG1-T4", "WZG1-T5", "WZG1-T6"]
    compatibility_classification: "TI ZNP software host slice and Circuits.UART serial adapter implemented with exact version admission, USB identity checks, finite serial owner, simulated independent byte peer, bounded AF request identity/correlation, typed IEEE/node/endpoint descriptor replies, exact one-byte SRSP validation, receiver-side finite command admission and separate indications. Bounded descriptor/Basic interviews preserve partial outcomes under one deadline, caller monitoring and finite route/token retirement. An explicit consumer-owned route ledger adopts complete interviews, quarantines conflicting claims, fences source resolution by epoch/time/sequence and expiry, and guards AF sends at the receiver with custody-bounded deadlines. Startup shares one open/write/version deadline, monitors negotiating callers, redacts callback faults and reports explicit close failure after one attempt. Physical macOS/Nerves qualification, credentials, recovery and NCP hardware qualification remain open; WZG.01 is not complete."
  - id: "WZG.02"
    version: "0.7.0-target"
    path: "docs/specs/WZG.02-network-zcl.md"
    implementation_status: "partial"
    standards: [{name: "ZCL global attribute wire profile", revision: "ZCL document 07-5123 revision 8, December 2019; finite global attributes and selected Basic client reads", claim: "bounded reads, ordinary writes, explicit reporting configuration/readback and source-matched responses for a finite value subset, plus selected Basic interview records; no complete ZCL or cluster conformance"}]
    requires: ["WZG.01"]
    implementation_modules: ["Wotex.Zigbee.ZCL", "Wotex.Zigbee.ZCL.Value", "Wotex.Zigbee.ZCL.Wire", "Wotex.Zigbee.ZCL.Configuration", "Wotex.Zigbee.ZCL.Configuration.Request", "Wotex.Zigbee.ZCL.Configuration.Codec", "Wotex.Zigbee.ZDO", "Wotex.Zigbee.Interview", "Wotex.Zigbee.Interview.Flow", "Wotex.Zigbee.Interview.Result", "Wotex.Zigbee.Owner", "Wotex.Zigbee.Routes"]
    executable_evidence: ["test/wotex/zigbee/routes_test.exs", "test/wotex/zigbee/routes_owner_test.exs", "test/wotex/zigbee/zcl_test.exs", "test/wotex/zigbee/zcl_value_test.exs", "test/wotex/zigbee/zcl_configuration_test.exs", "test/wotex/zigbee/zcl_configuration_owner_test.exs", "test/support/profiles/zcl-configuration-r8.json", "test/support/profiles/zcl-global-r8.json", "test/wotex/zigbee/zdo_test.exs", "test/wotex/zigbee/interview_test.exs", "test/wotex/zigbee/interview_owner_test.exs", "test/support/serial_peer.ex", "test/support/controlled_serial.ex"]
    required_cases: ["WZG2-T1", "WZG2-T2", "WZG2-T3", "WZG2-T4", "WZG2-T5", "WZG2-T6", "WZG2-T7"]
    compatibility_classification: "Finite ZCL global attribute codec, ZDO response decoders and a bounded owner-backed descriptor/Basic interview implemented. Revision 8 scalar/string non-values retain null and raw bytes, with explicit caller policy for full-range numeric attributes; unknown widths preserve the opaque remainder. Ordinary writes and send/receive reporting configuration/readback use bounded explicit requests, exact frame budgets and source/header matched per-record outcomes. Ambiguous records, unsupported configurations and Default Responses remain unconfirmed; the consumer owns dispatch, authorization and finite transaction/sequence correlation. The selected Basic client reads are pinned to ZCL revision 8 and preserve per-record failures and duplicate evidence. Consumer-owned raw-IEEE custody supports rejoin, conflict quarantine, epoch replacement, expiry and source observation ordering while preserving security disposition. Network identity continuity, joining, restore, sleepy-device policy, binding, migration, the adopted Zigbee core revision and physical qualification remain open. Manufacturer semantics remain consumer-owned."
  - id: "WZG.03"
    version: "0.2.0-target"
    path: "docs/specs/WZG.03-hardware-evidence.md"
    implementation_status: "partial"
    standards: []
    requires: ["WZG.01", "WZG.02"]
    implementation_modules: []
    executable_evidence: ["test/wotex/zigbee/frame_test.exs", "test/wotex/zigbee/owner_test.exs", "test/support/serial_peer.ex", "bench/output/protocol.md"]
    required_cases: ["WZG3-T1", "WZG3-T2", "WZG3-T3", "WZG3-T4", "WZG3-T5"]
    compatibility_classification: "Pure fixture and independently encoded simulated serial peer execute locally. Real coordinator, mains and sleepy endpoint, recovery, physical soak and cross-platform receipts are absent; no hardware or certification claim."
