    compatibility_classification: "Explicit persistent BlueZ request/command modes, current flag/MTU admission, closed queue evidence, write-only Form selection and Runtime accepted status are implemented with focused, Linux native and independent archive evidence. CoreBluetooth supplies an SDK owner, bounded native process, generation/route IPC, reserved nonblocking output and joined retirement. Fourteen operation, twenty-four injected-selector SDK and ten independent process cases cover the native paths. The SDK notification addition implements actual toggle/state/value selectors, explicit Apple mode selection, sixteen live streams, 64 shared credits, early-value retention, cumulative acknowledgement, retained stopped credit, route-reuse refusal and read/report isolation. Twelve literal mode and six control-state vectors are consumed by the SDK fixture; eight notification case families cover bounds, faults, original deadlines and actual object/delegate retirement. Three macOS build cases exercise compilation, passive ready probe, architecture/system linkage, embedded usage metadata, read-only reuse and artifact tampering. The public point Client retains private Peer/discovered routes, monitored artifact admission, one original startup deadline, a 64-call queue, exact route and marker/evidence correlation and joined cleanup. Public facade/Runtime cases use an independent process peer and the production Host loop. Notification Host/Client/Runtime integration, sleep observation, independent CoreBluetooth archive consumers and installed Mac/controller qualification remain open. These software cases establish no actual authorization, peripheral connection, pairing, RF or physical-effect result."
