arm64 and emulated x86_64 lanes. The ordinary, ASan/UBSan and LeakSanitizer lanes pass for native component, private-bus host and custody executables on Linux arm64. The Mix software build and run tasks boot the BlueZ virtual-controller fixture once per BEAM lane, and the Mix-built native host passes all 11 public BLE and Runtime interoperability tests, including ported owned-link, address-mismatch and wrong-challenge scenarios, and the 5 WBL-C09 lifecycle stress tests (1000 sequential operations, 100 open/close cycles, 100 receiver terminations, 32 concurrent callers with bounded admission, and forced deadline, corrupt-frame, host-loss and peer-close faults) in both lanes. Advisory scanning, x86_64 lanes and package gates remain open. The Python persistent adapter is retired; persistent BEAM contracts run through a scripted native protocol host and the production guardian."
