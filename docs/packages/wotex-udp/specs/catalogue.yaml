schema_version: "1.1.0"
package: "wotex_udp"
specifications:
  - id: "WUD.01"
    version: "0.6.0-target"
    path: "docs/specs/WUD.01-datagram-transport.md"
    implementation_status: "partial"
    standards:
      - {name: "UDP", revision: "RFC 768", claim: "transport semantics only; no WoT binding claim"}
      - {name: "Erlang/OTP socket", revision: "OTP 27.3.4.18 API documentation; tested on OTP 27.3.4.18 and OTP 29.0.4", claim: "deadline-aware asynchronous datagram send/receive, select cancellation and explicit socket options in the partial backend"}
    requires: []
    implementation_modules: ["Wotex.UDP", "Wotex.UDP.Admission", "Wotex.UDP.Backend", "Wotex.UDP.Config", "Wotex.UDP.Datagram", "Wotex.UDP.Endpoint", "Wotex.UDP.Error", "Wotex.UDP.Handle", "Wotex.UDP.Owner"]
    executable_evidence: ["test/wotex/udp/transport_test.exs", "test/wotex/udp/boundary_test.exs", "bin/check_archive.exs", "bin/check_application_free.exs"]
    required_cases: ["WUD-T1", "WUD-T2", "WUD-T3", "WUD-T4", "WUD-T5", "WUD-T6", "WUD-T7"]
    compatibility_classification: "Partial development implementation: bounded passive loopback, atomic complete-request and queued-send-byte publication under a 100-caller flood, expired queued-call rejection, explicit broadcast/multicast admission and egress interface, wildcard/scope rejection, independent multicast loopback peer, IPv6 scope, hop limits, source metadata, typed errors, supervised owner epochs, port reuse, an independent Erlang UDP peer and exact archive consumer. Mailbox-free owner handle retrieval, complete opaque-handle revalidation, active/queued caller-loss cancellation, live queued expiry, bounded close during receive, and a 100-cycle receive cancellation stress workload are implemented. Complete requests and budgets publish atomically into an owner-owned ETS queue with one rotating-alias wake and a ten-millisecond fallback sweep. Caller/owner loss before wake, retired notifications, closing admission and cancellation floods are covered. Kernel drop census, physical network interoperability and multi-platform evidence remain open. No complete WUD.01 claim."
