    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7", "claim": "explicitly selected partial native persistent/one-shot read, Write, Call and bounded child Browse client and persistent-only Value data-change subscriptions; typed/child-list pagination, the complete Runtime-supported scalar set, bounded numeric Runtime arrays and subscription lifecycle through Republish recovery, unavailable Republish, lifetime expiry and terminal server loss through native and Runtime paths have independent async-opcua evidence; full native profile unaccepted"}, {"name": "W3C WoT Thing Description 1.1", "revision": "Recommendation 2023-12-05", "claim": "Inherited core values/operation vocabulary; package profile is not W3C conformance"}]
