    executable_evidence: ["test/wotex/opcua/standalone_contract_test.exs", "test/wotex/opcua/binary/names_test.exs", "test/wotex/opcua/binary/reference_test.exs", "test/wotex/opcua/typed_values_test.exs", "test/wotex/opcua/open62541_test.exs", "test/interop/native_paged_test.exs", "test/interop/rust_peer_test.exs", "priv/native/browse_trace_check.c"]
    compatibility_classification: "WOP-P01 accepts F01 through F13 through pure typed value/identity/reference codecs with boundary and malformed-input tests. Partial native child Browse and typed reference pages have independent single-page evidence; typed pagination, release and persistent/one-shot child collection have same-stack secure C peer wire evidence. Up to 64 live continuations per Session and deadline-driven automatic release have native state, deterministic probe and same-stack wire evidence. WOP-F14..F16 execute as native traces with an injected SDK send boundary and a scripted host role, each killed by at least one mutant. At the independent async-opcua peer the server's live continuation-point count follows Browse, BrowseNext, explicit release, concurrent chains, limit failures and deadline expiry back to zero. The remaining N03/N04 boundary cases and the full Session and lifecycle cases remain required."
  - id: "WOP.06"
    version: "1.1.14"
    path: "docs/specs/WOP.06-wotex-integration.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Selected native ByteString Runtime Form paths have same-stack evidence; the complete Runtime-supported scalar set, selected special-type observations, observation cleanup, terminal peer loss and Int32/Double/dimensioned Int16 arrays have independent async-opcua evidence; full typed integration remains unaccepted"}, {"name": "W3C WoT Thing Description 1.1", "revision": "Recommendation 2023-12-05", "claim": "Inherited core values/operation vocabulary; package profile is not W3C conformance"}]
    requires: ["WOP.01", "WOP.04", "WOP.05", "wotex:WTX.01", "wotex:WTX.02", "wotex:WTX.03", "wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.OPCUA.Mapping", "Wotex.OPCUA.Transport", "Wotex.OPCUA.Value", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.RuntimeRelay", "Wotex.OPCUA.RuntimeHandle"]
    executable_evidence: ["test/wotex/opcua/open62541_test.exs", "test/interop/native_secure_test.exs", "test/wotex/opcua/runtime_stream_test.exs", "test/interop/native_runtime_stream_test.exs", "test/wotex/opcua/runtime_integration_test.exs", "test/interop/rust_peer_test.exs"]
    compatibility_classification: "One explicitly selected native one-shot Runtime ByteString Form path preserves raw scalar bytes and supports typed flat-array Write/readback/restore with ordered bounded binary elements. Runtime observeproperty runs through a relay owned by the real Runtime subscription process: ConsumedThing child specifications deliver same-stack-peer Double and ByteString values with observation metadata, stop and owner death return the peer's subscription counts to zero, and peer subscription loss reaches the receiver as session_lost; subscribeevent and one-shot configurations acquire no peer subscription. I04 error classes pass the complete table through ConsumedThing and Runtime.Retry. The I02 static one-shot and session profiles reject supplied contentType before I/O and project persistent Read/Write results; the integration corpus executes WOP-I-F01..F07, and both production profiles read, write and observe against the same-stack peer. The independent async-opcua peer returns the complete Runtime-supported scalar set, observes DateTime, Guid, ByteString, NodeId and StatusCode with cleanup, and roundtrips exact typed Int32/Double arrays plus a 2×3 Int16 matrix. Its real scalar Property observation deletes peer and local resources after stop and Runtime-owner death. Terminating an isolated peer produces one classified unavailable Runtime error and one transport_down, stops the supervised owner, reaps the relay helpers without reconnect, and requires an explicitly fresh child for a replacement peer. An exact-archive consumer of wotex_opcua, wotex_runtime and wotex archives built from one commit runs the native secure workflow against the same-stack peer on both required runtimes (X-F48); broader independent array breadth and the remaining I03/I05/I06 cells remain unaccepted."
  - id: "WOP.07"
    version: "1.1.52"
    path: "docs/specs/WOP.07-native-executable.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541 / OpenSSL", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Pinned static build, executable admission, custody, SDK value projection and secure native services; BrowseNext/release, Cancel, complete security matrix, the complete Runtime-supported scalar set, bounded numeric arrays and subscription lifecycle through Republish recovery, unavailable Republish, lifetime expiry and terminal server loss through native and Runtime paths have independent async-opcua 0.19.0 evidence with server resource counts; complete Session and lifecycle interoperability remains unaccepted"}]
    requires: ["WOP.01", "WOP.04", "WOP.05", "WOP.06"]
    implementation_modules: ["Wotex.OPCUA.Native.Build", "Wotex.OPCUA.Native.Source", "Wotex.OPCUA.Native.Archive", "Wotex.OPCUA.Native.Workspace", "Wotex.OPCUA.Native.Host", "Wotex.OPCUA.Native.HostOptions", "Wotex.OPCUA.Native.Config", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.Native.Executable", "Wotex.OPCUA.Native.Ready", "Wotex.OPCUA.Native.Frame", "Wotex.OPCUA.Native.Vendor", "Wotex.OPCUA.Native.Software"]
    executable_evidence: ["test/wotex/opcua/native/build_test.exs", "test/wotex/opcua/native/build_fault_test.exs", "test/wotex/opcua/native/custody_test.exs", "bin/check_native_custody.exs", "priv/native/custody_check.c", "priv/native/value_check.c", "priv/native/value_fault_check.c", "priv/native/native_contract_check.c", "priv/native/ipc_check.c", "priv/native/output_check.c", "priv/native/owner_check.c", "priv/native/publish_sequence_check.c", "priv/native/subscription_check.c", "priv/native/security_check.c", "priv/native/sdk_revision_check.c", "priv/native/browse_check.c", "priv/native/namespace_check.c", "priv/native/paged_peer.c", "priv/native/secure_peer.c", "test/interop/native_paged_test.exs", "test/interop/native_secure_test.exs", "test/interop/native_lifecycle_test.exs", "test/interop/native_subscription_test.exs", "test/interop/tampered_traffic_test.exs", "test/wotex/opcua/subscription_lifecycle_test.exs", "test/interop/security_fault_test.exs", "test/interop/rust_peer_test.exs", "test/interop/rust_peer/src/main.rs", "test/interop/rust_peer/Cargo.lock", "test/wotex/opcua/native/config_test.exs", "test/wotex/opcua/open62541_test.exs", "priv/native/session_probe.c", "test/wotex/opcua/native/frame_test.exs", "test/wotex/opcua/native/ready_test.exs", "test/wotex/opcua/native/executable_test.exs", "test/wotex/opcua/native/host_options_test.exs", "test/wotex/opcua/native/host_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/native/owner_fixture.c", "test/wotex/opcua/native/json_test.exs", "test/wotex/opcua/native/vendor_test.exs", "test/wotex/opcua/native/software_test.exs", "test/software/lifecycle_stress_test.exs", "test/interop/audit-requirements.lock"]
    compatibility_classification: "WOP-P00 accepts static native build, source/executable admission, bounded BEAM readiness and portable bidirectional custody for its exact evidence cohorts, including Linux sanitizer and leak lanes. WOP-P01 additionally accepts production parser/SDK value projection and a pure exact-match namespace translator for WOP-X-F01..F16. P02 slices encode owner-side frames/deadlines and credit, queue normal native output behind that credit in a bounded nonblocking queue, multiplex up to 64 native operations with request-scoped failures, nonblocking cancel and health through an injectable service boundary (binding WOP-X-F17..F20, F49, F50 and F52..F55 with an injected service), validate open shape and credentials, then activate, read, write, call, browse and close one secure native Session against the compiled same-stack Basic256Sha256 anonymous peer. The executable checks the revised timeout and server NamespaceArray, translates concrete input NodeIds through the SDK namespace map and returns a typed Value DataValue, individual Write status or ordered Call result. The BEAM owner correlates responses, replenishes consumed credit and preserves unknown mutation effect after transmitted failure. This binds no additional native-contract case and does not accept full P02/P03. A digest-checked SDK patch preserves the actual revised Session timeout and keeps pinned endpoint discovery on a secure channel. C-generated key/trust/SAN/URI/CRL, policy and token configuration vectors and a separate C probe provide prerequisite evidence. An explicitly selected public native client now uses bounded credential snapshots for persistent and one-shot secure Sessions, with same-stack ByteString array Write/readback, child Browse and one-shot Read/Write/Call success projection. The secure same-stack C peer proves BrowseNext/release and persistent/one-shot child-list pagination over the wire; its compatibility and service matrix remains partial. The facade preserves finite local mutation rejection as no-effect while uncertain failures remain unknown. BEAM-host concurrent admission, caller-timeout/caller-death cancellation and per-request terminal effects (WOP-X-F20, F22, F51, F56, F57) are implemented with process-fixture and deterministic probe evidence and 32 concurrent callers against the same-stack peer. Identity-bearing values are projected between SDK-local and server namespace indexes (native namespace_check with a reordered table and same-stack-peer NodeId/QualifiedName Write/readback). The public persistent client admits Read/Write/Call from any process (32 concurrent processes against the same-stack peer), and the counter-bearing peer proves explicit Session deletion and open-phase owner-death release. The three SignAndEncrypt policies with anonymous, username and certificate tokens execute Read/Write/Call/Browse/subscribe/unsubscribe/close against both the same-stack C peer and independent async-opcua Rust peer with peer subscription and MonitoredItem counters returning to zero (X-F30..F38 bound with peer subscription, continuation and local process counts). Both peers reject X-F39..F47; every isolated Rust fault variant records zero accepted application requests and leaves no Session or local native process. The independent Rust peer also proves exact public Runtime scalar Double and typed Int32/Double array plus 2×3 Int16 matrix read/write/restore. It delivers initial/fresh subscription reports, idempotent cancellation, receiver-death isolation and terminal-once receiver overflow with zero peer resources and a usable Session. It recovers a retained notification once and in order through a counted Republish; discarding the notification makes the counted Republish end only that subscription as sequence_gap with peer resources at zero and the Session usable. Stopping the SDK beyond the revised lifetime expires the independent server subscription, clears its peer resources and delivers one subscription_lost after resumption while preserving the Session. Terminating an isolated peer emits one BadCommunicationError-backed connection_failed, ends the Session and native helpers without reconnect/replay, and a replacement peer serves only through an explicit fresh connection. The BEAM host routes validated subscription reports to monitored receivers with receiver-queue bounds, late-subscribe cancellation and terminal-once delivery. Output written before native exit is handled in order, owner death notifies unanswered callers and receivers once, and a suspended owner under a continuous same-stack report producer receives exactly 16 credited reports before one receiver_overflow with native processes and the server Session released. Other native services, report buffering, cancellation and lifecycle stress remain required implementation."
