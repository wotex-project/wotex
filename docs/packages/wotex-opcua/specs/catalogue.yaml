    executable_evidence: ["test/wotex/opcua/binary_test.exs", "test/wotex/opcua/contract_test.exs", "test/wotex/opcua/dependency_security_test.exs", "test/wotex/opcua/mapping_test.exs", "test/wotex/opcua/port_test.exs", "test/wotex/opcua/value_test.exs", "test/wotex/opcua/open62541_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/interop/native_secure_test.exs", "test/interop/native_paged_test.exs", "test/interop/native_subscription_test.exs", "test/interop/oneshot_error_parity_test.exs", "test/interop/rust_peer_test.exs"]
    compatibility_classification: "The explicitly selected native client has bounded persistent/one-shot read, Write and Call evidence against the secure same-stack C peer, including typed ByteString array Write/readback. Persistent typed Browse preserves seven reference fields, remote identities, bound continuation handles, original deadline and cumulative limits. The same-stack peer proves typed BrowseNext/release and persistent/one-shot child-list pagination over the wire; the async-opcua peer independently proves the continuation/release subset with server counters, all nine policy/token service workflows and all nine security/fault rejections with zero accepted application requests. One-shot Read/Write/Call success shapes retain the recorded contract. Runtime ByteString Forms preserve raw scalar bytes and support explicit bounded flat-array Write/readback with ordered binary elements. Both Runtime profiles read/write the async-opcua Double, Int32-array, Double-array and 2×3 Int16-matrix values with exact type, value and dimensions; its real scalar observation releases peer and local resources after stop and owner death. Finite native pre-I/O mutation rejections retain no effect. Persistent native subscriptions deliver initial and fresh Value reports, cancel with same-stack subscription and MonitoredItem counters returning to zero, recover a withheld notification once through same-stack Republish, end once on receiver overflow or death, unavailable Republish or peer StatusChange and surface queue overflow InfoBits. The independent peer delivers initial/fresh reports, idempotent cancellation, receiver-death isolation and terminal-once receiver overflow with zero peer resources and a usable Session. It also recovers one retained notification once and in order through a server-counted Republish, while an unavailable server-counted Republish ends only the subscription as sequence_gap and clears peer resources. Stopping the SDK beyond the revised lifetime independently expires the server subscription, clears peer resources and delivers one subscription_lost after resumption without ending the Session. Terminating an isolated peer emits one BadCommunicationError-backed connection_failed, ends the Session and local helpers without reconnect/replay, and a replacement peer serves only through an explicit fresh connection. Broader wire-type breadth and lifecycle stress remain unaccepted. Complete P02/S02, error/lifecycle compatibility and software completion remain unaccepted."
  - id: "WOP.04"
    version: "1.1.14"
    path: "docs/specs/WOP.04-software-contract.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Typed-value projection, one same-stack secure native service/subscription slice, and independent async-opcua scalar Runtime breadth, Browse/Cancel/subscription-lifecycle/Republish/lifetime-expiry/server-loss through native and Runtime paths plus complete three-policy/three-token and security-rejection evidence; complete Session, recovery and lifecycle requirements remain unaccepted"}]
    requires: ["WOP.01", "WOP.02", "WOP.03"]
    implementation_modules: ["Wotex.OPCUA.Address", "Wotex.OPCUA.Binary", "Wotex.OPCUA.Client", "Wotex.OPCUA.Error", "Wotex.OPCUA.Frame", "Wotex.OPCUA.PortCall", "Wotex.OPCUA.Session", "Wotex.OPCUA.Subscription", "Wotex.OPCUA.Value", "Wotex.OPCUA"]
    executable_evidence: ["test/wotex/opcua/typed_values_test.exs", "test/wotex/opcua/standalone_contract_test.exs", "priv/native/value_check.c", "priv/native/value_fault_check.c", "priv/native/native_contract_check.c", "test/wotex/opcua/native/build_test.exs", "test/wotex/opcua/port_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/interop/native_subscription_test.exs", "test/interop/rust_peer_test.exs"]
    compatibility_classification: "WOP-P01 accepts S01 typed values and the exact WOP-F01..F13/WOP-X-F01..F16 pure/native projections. P02 slices activate one secure same-stack peer Session, acquire NamespaceArray and perform one-at-a-time typed Value Read/Write/Call and bounded one-page child Browse with concrete input namespace translation and no mutation retry; no complete S02 is accepted. S05 health_check/2 returns ok only after a concrete same-stack Read probe succeeds and its missing-node probe fails. S04 persistent Value subscriptions validate the closed request map before I/O, return an opaque handle after checked revisions and deliver ordered reports with C05 receiver bounds against the same-stack peer, including one-time Republish recovery, unavailable-Republish, StatusChange termination and overflow metadata. The independent async-opcua peer proves Browse continuation, Cancel, all nine X-F30..F38 policy/token workflows with Read, Write/readback, Call, Browse, subscribe/cancel and close and zero observed peer/local resources, all X-F39..F47 rejections before Session activation with zero peer application requests, baseline subscription ordering/cancel/receiver-death/receiver-overflow/Republish/lifetime-expiry/server-loss with zero peer resources, terminal-once delivery and explicit fresh reconnect, and scalar Double Runtime read/write/observe plus exact typed Int32/Double array and 2×3 Int16 matrix Runtime read/write/restore through real ConsumedThing ownership with peer/local cleanup after stop and owner death. Broader lifecycle and remaining service cells remain required."
