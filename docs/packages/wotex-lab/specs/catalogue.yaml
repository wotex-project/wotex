      - name: BeamLens
        revision: "0.3.1"
        claim: Trusted-local and isolated one-request-worker custom-skill integrations; upstream base node/time callbacks and log-store startup are disclosed. Public tenant workers share no BeamLens VM or state with the Workbench or another request.
