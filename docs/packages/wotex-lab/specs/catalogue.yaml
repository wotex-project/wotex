    compatibility_classification: Version 1.7.2 records that the unchanged native helper cohort runs in the explicit native-containment lane, not inside the package gate. Kernel containment profile 1.1.0 additively adds run_map/5 for contained work without a subject archive and an explicit network option whose internal-network variant is recorded as its own evidence value; external_map/6 keeps its arguments, flags and evidence. The WLB.06 record now also keeps the observed wall time of each contained lane case beside the profile's fixed hostile-target deadline. Kernel containment profile 1.0.0 added an additive OCI namespace and cgroup profile that closes hostile whole-tree isolation for its trusted runtime, kernel and pinned image. Reviewed-local profile 2.0.2 mounts a minimal /dev and selects C.UTF-8 for Linux Bubblewrap targets, and a pinned Linux lane executes that path. The target process now reads and writes protocol bytes independently of the host locale. Profile 2.0.1 gives the external Rust helper a fixed one-second runner margin around its inner deadline and reports the effective margin plus 150 ms cleanup ceiling. The main repository gate now executes its locked unit and feature-gated lifecycle tests in a private cleaned target; sampled Darwin limits do not close hostile whole-tree isolation, and binary artifact adoption remains separate.
