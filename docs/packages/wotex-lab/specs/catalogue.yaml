    compatibility_classification: Optional host contract; the additive WLB.07 queryMetrics control operation binds the query descriptor to one browser session's room history over HTTP, while the operator listeners and the MCP tool are unchanged. The additive Provisioning.provision_hosted call provisions retention on a pinned hosted HTTPS receiver with a separate administrative credential, while local provisioning is unchanged. Otlp.GreptimeSink additively accepts a per-write credential function and the Workbench can select an authenticated, pinned hosted OTLP receiver with its own export credential, while sinks and local profiles without a credential send none. Metrics.Gateway additively accepts a durable executor in place of a history PID, and the additive Workbench DurableReader lets the operator listener answer POST /durable/query from a local receiver or, when separately selected, a pinned hosted HTTPS receiver with its own query credential, while POST /query and history-bound gateways are unchanged. DurableQuery now refuses a start that is not a whole multiple of the step, because GreptimeDB 1.1.4 can omit values on such grids; callers must align their range. The additive base DurableQuery module answers admitted descriptors from a PromQL-compatible receiver through fixed read templates and a host executor, while local History behaviour is unchanged; the additive Investigation.Disclosure states before submission whether trusted-local investigation data leaves the host and what it contains; trusted-local investigation answers now withhold findings that do not cite evidence digests the investigation received, and completed broker results carry that evidence record; the additive Collector attribute_to option records only events from one owner process tree, while collectors without it keep recording every event. The unchanged inert Grafana export now has a separately selected import and query-execution lane against one pinned Grafana and GreptimeDB cohort. The Workbench can activate the OTLP exporter for an exact local receiver. An additive, explicitly started OTLP exporter sends closed Lab spans and exception logs, and Metrics.ReqSink results additionally carry the bounded response body. An additive mutual-TLS remote transport with peer ranges serves the operator scrape and query listeners, while the loopback transport stays the default. Additive Retention plans provision a verified local GreptimeDB database TTL (7d default, 1h to 3650d) and the exporter can select that database, while writes without a selection keep the public database. An additive loopback operator listener binds the query descriptor to POST /query with its own credential, one inspection scope per request and reduced limits, while public and tenant query bindings stay planned. The MCP query_metrics tool now binds one disposable local gateway per call; bridge captures require strictly advancing wall timestamps and revalidated snapshots. The Workbench can explicitly compose the bridge with an exact loopback endpoint or a separately selected authenticated HTTPS endpoint whose audience, DNS answers, peer and TLS identity are checked on every write; remote receiver operation remains independent evidence. History queries require an explicitly bound instance and refuse substituted scope, altered metric cohorts and wall-clock rollback. Atomic diagnostic export creates an inert content-addressed, masked, unsplit dataset at an exact history watermark; storage-only history remains available. The checked-in Workbench is the inspectable reference source, while artifact adoption remains a separate axis. Its trusted-local BeamLens profile requires explicit history/provider activation, has one bounded owner-and-room-bound browser investigation, gates BAML provider calls with an active-scope capability and discloses upstream node/time callbacks; shared hosted tenants remain unimplemented. No mandatory observability or model dependency enters the base library.
