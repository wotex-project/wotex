    standards:
      - name: Prometheus Remote Write
        revision: "1.0"
        claim: Hand-encoded sender proven against greptime/greptimedb:v1.1.4 behind WOTEX_LAB_GREPTIME=1; no compatibility claim for other receivers or senders.
      - name: Prometheus text exposition format
        revision: "0.0.4"
        claim: Pinned self-scraper input contract for counters, gauges and classic histograms; summaries and untyped series are refused.
      - name: Snappy block format
        revision: "google/snappy format_description"
        claim: Pure Elixir literal and 16-bit-offset copy encoder plus a full block decoder; no stream framing.
      - name: OpenTelemetry Protocol (OTLP/HTTP protobuf)
        revision: "opentelemetry-proto v1.5.0"
