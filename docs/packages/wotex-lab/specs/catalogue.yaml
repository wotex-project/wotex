    compatibility_classification: >-
      Version 0.31.0 connects the previously catalogue-only cleanup,
      subscription-drop, batch mask/quality, direct-inference queue-depth and
      isolated-investigation measurements to their bounded source owners. The
      established formal and trusted-local investigation emitters are now
      recorded explicitly. Metric names, types, units, buckets and dimensions
      are unchanged. The optional host contract still binds WLB.07 queryMetrics
      to one browser room; the MCP tool binds one disposable local gateway. The
      operator listener keeps its local-history and durable routes. A separate
      public TLS listener now binds digest-authenticated tenants only to their
      configured durable instances, with fixed request, query, rate and
      concurrency limits. Public investigations run in one-request external
      BEAM VMs under a native process-tree custodian; full artifact digests and
      expiring provider/query capabilities are verified for every request.
      This adds no public route to volatile host history and changes no existing
      listener or control operation.

      Metrics.Gateway accepts either an exact history PID or a durable executor.
      DurableQuery uses fixed PromQL-compatible templates and refuses unaligned
      grids that GreptimeDB 1.1.4 can answer inconsistently. History queries
      require an explicit instance and reject substituted scope, altered metric
      cohorts and wall-clock rollback. Collector attribute_to restricts one
      collector to an owner process tree. Atomic export retains an exact history
      watermark in an inert, content-addressed, masked and unsplit dataset.

      Local and hosted Greptime write, read, retention and OTLP paths retain
      separate credentials. Hosted destinations re-resolve DNS, reject
      inadmissible peers and verify the original TLS identity on each exchange.
      Local writes without a selected database keep using public; retention
      plans use 7d by default and admit 1h through 3650d. The mutual-TLS
      operator transport remains separate from the public tenant listener.
      Remote receiver operation, durable rows and public adoption remain
      independent evidence.

      The trusted-local BeamLens profile keeps its one owner-and-room-bound
      browser investigation and discloses upstream node/time callbacks. Public
      tenants use the isolated hosted skill instead; they share no BeamLens VM,
      context, capability or log store with the Workbench or another request.
      Both profiles withhold findings that do not cite evidence digests received
      during that investigation. Grafana import/query evidence remains tied to
      the pinned Grafana and GreptimeDB cohort. No mandatory observability,
      database or model dependency enters the base library.
