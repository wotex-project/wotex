name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names, or 'all'"
        default: all
      native:
        description: "Also run the native and software-profile lane"
        type: boolean
        default: false
  schedule:
    # Nightly native and software-profile lane over every native package.
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: dev
  # Native formatting and static analysis use LLVM from apt.llvm.org, the
  # major version .clang-format was measured with (the images in
  # tooling/native/docker pin the same major).
  LLVM_MAJOR: "23"

jobs:
  manifest:
    # tooling/packages.yaml is the single source of the toolchain lanes and of
    # the native packages; rust-toolchain.toml pins Rust. Every job reads them
    # from here.
    name: Toolchains and native packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.read.outputs.lanes }}
      toolchains: ${{ steps.read.outputs.toolchains }}
      native: ${{ steps.read.outputs.native }}
      rust: ${{ steps.read.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tooling/packages.yaml
            rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Read tooling/packages.yaml and rust-toolchain.toml
        id: read
        shell: bash
        run: |
          set -euo pipefail
          manifest=tooling/packages.yaml
          # ["minimum","current"]
          lanes=$(yq -o=json -I=0 '.lanes | keys' "$manifest")
          # {"minimum":{"elixir":"...","otp":"..."},"current":{...}}
          toolchains=$(yq -o=json -I=0 '.lanes | map_values({"elixir": .elixir, "otp": .otp})' "$manifest")
          # The packages with native: true, in manifest order.
          native=$(yq -o=json -I=0 '[.packages | to_entries | .[] | select(.value.native == true) | .key]' "$manifest")
          rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          for value in "$lanes" "$toolchains" "$native" "$rust"; do
            if [ -z "$value" ] || [ "$value" = null ] || [ "$value" = "[]" ]; then
              echo "could not read the lanes, native packages and Rust toolchain"; exit 1
            fi
          done
          {
            echo "lanes=$lanes"
            echo "toolchains=$toolchains"
            echo "native=$native"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"
          echo "lanes: $lanes"; echo "toolchains: $toolchains"; echo "native: $native"; echo "rust: $rust"

  affected:
    name: Affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: manifest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      any: ${{ steps.select.outputs.any }}
      native: ${{ steps.select.outputs.native }}
      any_native: ${{ steps.select.outputs.any_native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          # The current lane is also the workspace toolchain.
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.otp }}
      - name: Workspace dependencies
        run: mix deps.get --check-locked
      - name: Compile workspace tooling
        run: mix compile --warnings-as-errors
      - name: Select packages
        id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              requested="${{ github.event.inputs.packages }}"
              if [ "$requested" = "all" ]; then
                packages=$(mix wotex.affected --all --json)
              else
                packages=$(printf '%s\n' $requested | jq -R . | jq -sc .)
              fi
              ;;
            schedule)
              packages=$(mix wotex.affected --all --json)
              ;;
            pull_request)
              packages=$(mix wotex.affected --base "origin/${{ github.base_ref }}" --json)
              ;;
            *)
              packages=$(mix wotex.affected --base "${{ github.event.before }}" --json)
              ;;
          esac
          packages=$(jq -ce 'if type == "array" then . else error("affected packages must be a JSON array") end' <<< "$packages")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ "$packages" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          native=$(jq -cn --argjson packages "$packages" \
            --argjson native '${{ needs.manifest.outputs.native }}' \
            '$packages - ($packages - $native)')
          echo "native=$native" >> "$GITHUB_OUTPUT"
          if [ "$native" = "[]" ]; then echo "any_native=false" >> "$GITHUB_OUTPUT"; else echo "any_native=true" >> "$GITHUB_OUTPUT"; fi
          echo "affected: $packages"
          echo "affected native: $native"

  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [manifest, affected]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: workspace-${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      - name: Documentation links and family catalogue
        # Every relative link in tracked Markdown resolves and
        # docs/catalogue.yaml is current (mix wotex.catalogue --check).
        run: mix docs.check
      - name: Pinned native sources
        run: mix wotex.native.sources
      - name: LLVM ${{ env.LLVM_MAJOR }} (clang-format)
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_MAJOR}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.manifest.outputs.rust }}
          components: rustfmt, clippy
      - name: Native formatting and Rust
        # clang-format on the C and C++ lines the change touches, rustfmt and
        # clippy in every package, cargo test for the Rust crate. clang-tidy and
        # the C and C++ native tests run in each package's gate.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            mix native.lint --all --base "$base"
          else
            mix native.lint --all
          fi
          mix native.test --package wotex-lab
      - name: Sibling API boundary dependencies
        if: needs.affected.outputs.any == 'true'
        env:
          AFFECTED_PACKAGES: ${{ needs.affected.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          jq -er '.[]' <<< "$AFFECTED_PACKAGES" | while IFS= read -r package; do
            env MIX_ENV=test mix pkg "$package" deps.get --check-locked
          done
      - name: Sibling API boundary
        if: needs.affected.outputs.any == 'true'
        env:
          AFFECTED_PACKAGES: ${{ needs.affected.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r package; do
            args+=(--package "$package")
          done < <(jq -er '.[]' <<< "$AFFECTED_PACKAGES")
          mix wotex.boundary "${args[@]}"
      - name: Governance files are shared
        shell: bash
        run: |
          set -euo pipefail
          stray=$(git ls-files packages | grep -E '^packages/[^/]+/(CODE_OF_CONDUCT|CONTRIBUTING|GOVERNANCE|SECURITY|AGENTS)\.md$|^packages/[^/]+/(\.claude|\.github|docs)/' || true)
          if [ -n "$stray" ]; then echo "$stray"; echo "package-level copies of shared files found"; exit 1; fi
          for f in packages/*/LICENSE; do cmp -s "$f" LICENSE || { echo "$f differs from the root LICENSE"; exit 1; }; done

  check:
    name: ${{ matrix.package }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    # Runtime gates precede the native SDK validation matrix below.
    timeout-minutes: 75
    needs: [manifest, affected]
    if: needs.affected.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.affected.outputs.packages) }}
        lane: ${{ fromJSON(needs.manifest.outputs.lanes) }}
    env:
      WOTEX_PATH_DEPS: "1"
      # Production analysis and application checks must exclude test helpers
      # and test-only runtime dependencies. Coverage selects test separately.
      MIX_ENV: dev
      ELIXIR_ERL_OPTIONS: "+fnu"
      # Runtime tests can also build native SDK workspaces.
      WOTEX_NATIVE_CACHE: ~/.cache/wotex-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains)[matrix.lane].elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains)[matrix.lane].otp }}
      - name: Workbench Node
        if: matrix.package == 'wotex-lab' && matrix.lane == 'current'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          package-manager-cache: false
      - name: Workbench pnpm
        if: matrix.package == 'wotex-lab' && matrix.lane == 'current'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 12.4.2
          run_install: false
      - name: Containment fixture Rust
        # Lab runtime tests compile the containment helper independently of
        # the native formatting, analysis and unit-test job.
        if: matrix.package == 'wotex-lab'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.manifest.outputs.rust }}
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          # hosts/* holds reference hosts: separate Mix projects with their own
          # locks that a package's gate runs. Most packages have none.
          # Retain the original NIF archives too: Lab's offline hosted build
          # verifies their checksums even when compiled dependencies are restored.
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
            packages/${{ matrix.package }}/hosts/*/deps
            packages/${{ matrix.package }}/hosts/*/_build
            ~/.cache/rustler_precompiled
          key: package-v2-${{ matrix.package }}-${{ matrix.lane }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package), format('packages/{0}/hosts/*/mix.lock', matrix.package)) }}
      - name: Native toolchain
        # Runtime fixtures compile C/C++; OPC UA coverage also builds its
        # pinned open62541 SDK before the separate native validation job.
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libexpat1-dev libglib2.0-dev libmnl-dev
      - name: Dependencies
        working-directory: packages/${{ matrix.package }}
        run: mix deps.get --check-locked
      - name: Prepare Lab build environments
        if: matrix.package == 'wotex-lab'
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          # EXLA shares its native library across build environments. Compile
          # each environment before the gate VM can load that library, so a
          # later coverage or documentation build cannot overwrite a live NIF.
          for build_env in dev test docs; do
            env MIX_ENV="$build_env" mix compile --warnings-as-errors
          done
      - name: Package gate
        # Fail behaviour, coverage, archive and analysis checks before starting
        # SDK validation. Native checks remain required in native_check.
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          # The lane's skip list keeps static analysis on the current lane only.
          except=(--except native_format --except native_lint --except native_test)
          while IFS= read -r check; do
            except+=(--except "$check")
          done < <(yq -r '.lanes["${{ matrix.lane }}"].skip // [] | .[]' ../../tooling/packages.yaml)
          mix check --no-retry "${except[@]}" 2>&1 | tee "$RUNNER_TEMP/package-gate.log"
      - name: Retain package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-${{ matrix.package }}-${{ matrix.lane }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/package-gate.log
            packages/${{ matrix.package }}/cover/

  native_check:
    name: ${{ matrix.package }} native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: [manifest, affected, workspace, check]
    if: needs.affected.outputs.any_native == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.affected.outputs.native) }}
    env:
      WOTEX_PATH_DEPS: "1"
      MIX_ENV: dev
      ELIXIR_ERL_OPTIONS: "+fnu"
      WOTEX_NATIVE_CACHE: ~/.cache/wotex-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
            packages/${{ matrix.package }}/hosts/*/deps
            packages/${{ matrix.package }}/hosts/*/_build
            ~/.cache/rustler_precompiled
          key: package-v2-${{ matrix.package }}-current-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package), format('packages/{0}/hosts/*/mix.lock', matrix.package)) }}
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libexpat1-dev libglib2.0-dev libmnl-dev
      - name: LLVM ${{ env.LLVM_MAJOR }} (clang-format, clang-tidy)
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_MAJOR}" "clang-tidy-${LLVM_MAJOR}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.manifest.outputs.rust }}
          components: rustfmt, clippy
      - name: Native cache key
        if: matrix.package != 'wotex-matter'
        id: native_cache
        shell: bash
        run: |
          set -euo pipefail
          inputs=(
            "HEAD:packages/${{ matrix.package }}"
            "HEAD:lib"
            "HEAD:tooling/native"
            "HEAD:tooling/packages.yaml"
            "HEAD:rust-toolchain.toml"
            "HEAD:.clang-format"
            "HEAD:.clang-format-ignore"
            "HEAD:.clang-tidy"
          )
          digest=$(
            for input in "${inputs[@]}"; do
              git rev-parse "$input"
            done | git hash-object --stdin
          )
          echo "key=native-${{ matrix.package }}-$digest" >> "$GITHUB_OUTPUT"
      - if: matrix.package != 'wotex-matter'
        # Keyed from tracked inputs before the gate creates nested build trees.
        # Matter's SDK workspace is several GB; its gate rebuilds it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/wotex-native/${{ matrix.package }}
          key: ${{ steps.native_cache.outputs.key }}
      - name: Workspace dependencies
        # Native validation uses the root mix native.* tasks.
        run: mix deps.get --check-locked
      - name: Package dependencies
        run: mix pkg "${{ matrix.package }}" deps.get --check-locked
      - name: Native formatting and analysis
        shell: bash
        run: |
          set -euo pipefail
          mix native.lint --tidy --package "${{ matrix.package }}" 2>&1 | tee "$RUNNER_TEMP/native-lint.log"
      - name: Native tests
        shell: bash
        run: |
          set -euo pipefail
          mix native.test --package "${{ matrix.package }}" 2>&1 | tee "$RUNNER_TEMP/native-test.log"
      - name: Retain native gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-gate-diagnostics-${{ matrix.package }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-lint.log
            ${{ runner.temp }}/native-test.log
            ~/.cache/wotex-native/${{ matrix.package }}/**/*.log

  archive:
    name: Archives and consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [manifest, affected, workspace, check, native_check]
    if: >-
      !cancelled() && needs.affected.outputs.any == 'true' &&
      needs.workspace.result == 'success' && needs.check.result == 'success' &&
      (needs.native_check.result == 'success' || needs.native_check.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.otp }}
      - run: mix deps.get --check-locked
      - name: Package dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            (cd "packages/$package" && WOTEX_PATH_DEPS=1 mix deps.get --check-locked)
          done < <(jq -r '.[]' <<< '${{ needs.affected.outputs.packages }}')
      - name: Build and inspect archives
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r package; do
            args+=(--package "$package")
          done < <(jq -r '.[]' <<< '${{ needs.affected.outputs.packages }}')
          mix wotex.archive "${args[@]}"

  native:
    name: ${{ matrix.package }} native lane
    # The BLE software fixture builds and boots arm64 guest images.
    runs-on: ${{ matrix.package == 'wotex-ble' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    needs: [manifest, affected]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.native == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native'))
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.manifest.outputs.native) }}
    env:
      WOTEX_PATH_DEPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.elixir }}
          otp-version: ${{ fromJSON(needs.manifest.outputs.toolchains).current.otp }}
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libexpat1-dev libglib2.0-dev libmnl-dev
      - run: mix deps.get --check-locked
      - name: Package dependencies
        working-directory: packages/${{ matrix.package }}
        run: mix deps.get --check-locked
      - name: Native build
        shell: bash
        run: |
          set -euo pipefail
          task=$(yq -r '.packages["${{ matrix.package }}"].native_task // ""' tooling/packages.yaml)
          if [ -n "$task" ]; then
            mix wotex.native.build --package ${{ matrix.package }} --workspace "$RUNNER_TEMP/native-${{ matrix.package }}"
          else
            echo "no native build task for ${{ matrix.package }}"
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.manifest.outputs.rust }}
          components: rustfmt, clippy
      - name: OPC UA Rust advisory tool
        if: matrix.package == 'wotex-opcua'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Software profile
        shell: bash
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          task=$(yq -r '.packages["${{ matrix.package }}"].software_task // ""' ../../tooling/packages.yaml)
          if [ -n "$task" ]; then
            workspace="$RUNNER_TEMP/software-${{ matrix.package }}"
            mix "${task%.run}.build" --workspace "$workspace"
            if [[ "$task" == *.opcua.software.run ]]; then
              (cd ../wotex && env -u WOTEX_PATH_DEPS mix hex.build --output "$RUNNER_TEMP/wotex.tar")
              (cd ../wotex-runtime && env -u WOTEX_PATH_DEPS mix hex.build --output "$RUNNER_TEMP/wotex-runtime.tar")
              mix "$task" --workspace "$workspace" \
                --core-archive "$RUNNER_TEMP/wotex.tar" \
                --runtime-archive "$RUNNER_TEMP/wotex-runtime.tar"
            else
              mix "$task" --workspace "$workspace"
            fi
          else
            echo "no software profile task for ${{ matrix.package }}"
          fi
      - name: LLVM ${{ env.LLVM_MAJOR }} (clang-format, clang-tidy)
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_MAJOR}" "clang-tidy-${LLVM_MAJOR}"
      - name: Native lint and tests
        # clang-tidy and the native tests of every native_check suite. A suite
        # whose build task is the package's native_task reuses the build above.
        shell: bash
        env:
          WOTEX_NATIVE_CACHE: ${{ runner.temp }}/native-cache
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          task=$(yq -r ".packages[\"$package\"].native_task // \"\"" tooling/packages.yaml)
          suite=$(yq -r ".packages[\"$package\"].native_check[] | select(.build) | .build" tooling/packages.yaml)
          workspace=()
          if [ -n "$task" ] && [ "$suite" = "$task" ]; then
            workspace=(--workspace "$RUNNER_TEMP/native-$package")
          fi
          mix native.lint --tidy --no-format --package "$package" "${workspace[@]}"
          mix native.test --package "$package" "${workspace[@]}"
      - name: Upstream advisories
        run: mix wotex.native.advisories --package "${{ matrix.package }}"
      - name: Retain native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.package }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-${{ matrix.package }}/logs/
            ${{ runner.temp }}/native-${{ matrix.package }}/*manifest.json
            ${{ runner.temp }}/software-${{ matrix.package }}/logs/
            ${{ runner.temp }}/software-${{ matrix.package }}/software-run/
            ${{ runner.temp }}/software-${{ matrix.package }}/run-*/**/*.log
            ${{ runner.temp }}/software-${{ matrix.package }}/run-*/**/result.json
            ${{ runner.temp }}/software-${{ matrix.package }}/*.log
            ${{ runner.temp }}/software-${{ matrix.package }}/*.json
