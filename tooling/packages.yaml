        compile:
          - files: [bench/native/output_queue.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native"]
          - files: [priv/native/output.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -D_POSIX_C_SOURCE=200809L, "-I{package}/priv/native"]
      - bench: json_codec
        kind: nanobench
        title: Strict JSON reader
        description: >-
          `wop_json_read` of the OPC UA host (`priv/native/json_codec.c` over the
          vendored yyjson 0.12.0) on request frames the BEAM host writes: a Read, an
          `open` carrying 2048-bit RSA credential envelopes, a Write of 1024 Doubles,
          a Write of a 64 KiB ByteString and a request whose parameters hold 1024
          keys, the container limit, at which the duplicate-key check compares every
          key with each preceding one. Each parse uses one 2 MiB pool and releases
          its document; the unit is one frame. The exact number readers
          (`wop_json_double`, `wop_json_float`, `wop_json_int64`,
          `wop_json_uint64`) run over the 1024 raw tokens of a parsed Double or
          Int64 array; their unit is one token.
        compile:
          - files: [bench/native/json_codec.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/json_codec.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
      - bench: ipc
        kind: nanobench
        title: Input framing and envelope admission
        description: >-
          `priv/native/ipc.c` of the OPC UA host: `wop_ipc_feed` assembling
          LF-terminated request lines: a Read from one read and from 64-byte reads, 16
          Reads coalesced in one read, and a 7.4 KB Write of 1024 Doubles from one
          read (unit: one line); and the closed shape checks applied to a
          parsed line: the request envelope, the credit control and the `open`
          parameters with 2048-bit RSA credential envelopes, whose base64 is checked
          character by character (unit: one check).
        compile:
          - files: [bench/native/ipc.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/ipc.c, priv/native/json_codec.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
      - bench: owner
        kind: nanobench
        title: Process owner request cycle
        description: >-
          The process owner of the OPC UA host (`priv/native/owner.c` with the
          output queue, input framing and JSON reader) on an open Session. A request
          line is framed, parsed, admitted and prepared; the next tick dispatches it,
          completes it and emits the reply through the credited output queue to a
          nonblocking pipe; the driver reads each reply line and returns one credit
          control for it, as the BEAM host does. Both input lines of a request, the
          request and its credit, are parsed and the 2 MiB parser pool is erased
          after each. The SDK is replaced by an in-process service that completes
          every dispatched operation on the same tick and validates only the
          parameter object, so the rows measure the owner's own work: a Read, a Write
          of 1024 Doubles and 16 Reads coalesced in one input read. The unit is one
          request.
        compile:
          - files: [bench/native/owner.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/owner.c, priv/native/output.c, priv/native/ipc.c, priv/native/json_codec.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -D_POSIX_C_SOURCE=200809L, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
      - bench: publish_sequence
        kind: nanobench
        title: Notification sequence state
        description: >-
          The per-subscription notification sequence state of the OPC UA host
          (`priv/native/publish_sequence.c`): classification and recording of the
          next data-change notification once the cache holds its 1024
          sequence/digest pairs, duplicate detection of the latest and of the oldest
          cached notification, recovery of a 100-message gap by ordered Republish
          followed by delivery of the held notification, and the first 16
          notifications of a new subscription. The unit is one notification.
        compile:
          - files: [bench/native/publish_sequence.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native"]
          - files: [priv/native/publish_sequence.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/priv/native"]
      - bench: subscription_rules
        kind: nanobench
        title: Subscription parameter rules
        description: >-
          `priv/native/subscription_rules.c` of the OPC UA host:
          `wop_subscription_read` on the closed seven-key parameter map of a parsed
          subscribe request, accepted and rejected for a lifetime below three
          keepalives, and `wop_subscription_revision_valid` on server-revised
          parameters. The unit is one check.
        compile:
          - files: [bench/native/subscription_rules.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/subscription_rules.c, priv/native/json_codec.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/priv/native", -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
          - files: [priv/native/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, -DYYJSON_DISABLE_FAST_FP_CONV=0, -DYYJSON_DISABLE_UTF8_VALIDATION=0]
      - bench: custody
        kind: nanobench
        title: Runtime custody relay
        description: >-
          The runtime custody guardian of the OPC UA host (`priv/native/custody.c`),
          which relays opaque bytes between the BEAM host and the SDK executable. It
          is compiled with its `main` renamed and run in a forked child whose
          standard input and output are pipes owned by the driver, as the BEAM Port
          runs the executable, with the OPC UA profile's limits (500 ms cleanup,
          131072-byte input and 65536-byte output queues); the guardian's own `exec`
          is not measured. The guarded child is the driver re-executed as a line
          echo standing in for the SDK host. The relay rows send a 256-byte or
          16 KiB line and read it back on a running Session (unit: one round trip);
          the lifecycle rows start the guardian and its child, make one round trip,
          end the child with `quit` and check that custody exits with status 0 after
          reaping it (unit: one session). The rows without custody talk to the same
          echo process over plain pipes as the baseline.
        compile:
          - files: [bench/native/custody.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror]
          - files: [priv/native/custody.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wotex_opcua_custody_main]
      - bench: build_command
        kind: nanobench
        title: Build command guardian
        description: >-
          The POSIX command guardian of the explicit native build
          (`priv/native/build_command.c`), through which
          `Wotex.OPCUA.Native.Command` runs every recipe step. It is compiled with
          its `main` renamed and run in a forked child with an owner-liveness pipe as
          standard input and a pipe to the driver as standard output, as the Mix
          owner runs the executable (the guardian's own `exec` is not measured). The
          guarded command is the driver re-executed in a child mode that exits at
          once or writes 1 MiB; each row collects the output to EOF and checks both
          exit statuses and the byte count, and the rows without the guardian spawn
          the same command directly as the baseline. The unit is one command.
        compile:
          - files: [bench/native/build_command.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror]
          - files: [priv/native/build_command.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wotex_opcua_build_command_main]
      - bench: session
        kind: elixir
        title: Persistent Session services
        description: >-
          End-to-end services through the public API of the package on one
          persistent Session of `Wotex.OPCUA.Open62541` (Basic256Sha256,
          SignAndEncrypt, anonymous user) with the executables of the native build,
          against the same-stack open62541 peer the build also produces
          (`priv/native/paged_peer.c`) on loopback, with disposable RSA 2048
          credentials the script generates. Every call crosses the BEAM host, the
          custody guardian, the native owner, the SDK, the secure channel and the
          peer. The jobs are a Read of an Int32 Value; a Write of a Double, which the
          peer rejects with BadUserAccessDenied because its Variables grant anonymous
          users no write access, so it covers the whole request path without storing
          a value; one Browse page (the peer returns one reference per page) and the
          release of its continuation point; a Browse of three children in three
          pages (Browse and two BrowseNext); and the creation and deletion of a
          subscription with one Value MonitoredItem. Between iterations the peer
          waits up to 20 ms on its standard input, and each request would wait for
          that timeout; the script keeps one statistics request in flight on that
          input, so the peer's loop turns continuously. Each job runs in a process
          that opened its own Session; one measurement is one call.
        env:
          WOTEX_BENCH_WORKSPACE: "{workspace}"
          WOTEX_BENCH_SCRATCH: "{scratch}"
      - bench: notification
        kind: elixir
        title: Subscription notification round trip
        description: >-
          Data-change notifications on one persistent Session against the same-stack
          open62541 peer, with the credentials, peer pacing and executables of the
          Persistent Session services benchmark. The subscription has one Value
          MonitoredItem on the peer's Double Variable `burst` with sampling interval
          0, so the peer samples every write, and queue size 10. One measurement
          asks the peer to write five consecutive values in one server iteration and
          waits until the subscribing process has received the five notifications in
          order and without overflow. The peer's SDK revises the requested 10 ms
          publishing interval to its default minimum of 100 ms, so the wait for the
          next publishing cycle dominates this time; the delivery-latency table at
          the end isolates the path from the server's PublishTime to the subscriber.
        env:
          WOTEX_BENCH_WORKSPACE: "{workspace}"
          WOTEX_BENCH_SCRATCH: "{scratch}"
  wotex-thread:
    app: wotex_thread
    depends_on: [wotex, wotex-runtime]
    native: true
    native_task: wotex.thread.native.build
    software_task: wotex.thread.software.run
    native_artifacts:
      - {profile: production, descriptor: priv/native-artifacts/production.json}
      - {profile: sanitizers, descriptor: priv/native-artifacts/sanitizers.json}
      - {profile: software-network, descriptor: priv/native-artifacts/software-network.json}
    native_check:
      # The SDK-free protocol, storage, output, stream and flow tests.
      - suite: protocol
        prepare:
          - [cmake, -S, "{package}/priv/openthread", -B, "{scratch}/tests", -DCMAKE_BUILD_TYPE=Debug, -DWOTEX_NATIVE_SANITIZERS=ON, "-DWOTEX_NATIVE_TEST_SOURCE={package}/test/native", -DCMAKE_EXPORT_COMPILE_COMMANDS=ON]
        compile_commands: ["{scratch}/tests/compile_commands.json"]
        compile:
          - files: [priv/openthread/build_command.c, "test/fixtures/*.c"]
            flags: [-std=c11]
        test:
          - [cmake, --build, "{scratch}/tests", --parallel, "4"]
          - [ctest, --test-dir, "{scratch}/tests", --output-on-failure]
      # The host and the tests that link the pinned OpenThread SDK (Linux).
      - suite: openthread
        requires: [linux]
        build: wotex.thread.native.build
        prepare:
          - [cmake, -G, Ninja, -S, "{package}/priv/openthread", -B, "{scratch}/sdk", -DCMAKE_BUILD_TYPE=Debug, "-DWOTEX_OPENTHREAD_SOURCE={workspace}/sources/openthread/openthread-f34c5e5476829d9205e80b37fccc2bdfe97e1dab", "-DWOTEX_JSON_HEADER={workspace}/downloads/json.hpp", "-DWOTEX_NATIVE_TEST_SOURCE={package}/test/native", -DCMAKE_EXPORT_COMPILE_COMMANDS=ON]
        compile_commands: ["{scratch}/sdk/compile_commands.json"]
        test:
          - [cmake, --build, "{scratch}/sdk", --parallel, "4", --target, wotex-thread-spinel-test, wotex-thread-dataset-seed, wotex-thread-flow-host]
          - [ctest, --test-dir, "{scratch}/sdk", --output-on-failure, -R, SPINEL]
    native_bench:
      - bench: protocol_frames
        kind: nanobench
        title: Bridge frame parsing and encoding
        description: >-
          Bounded parsing of the owner's lines by the Thread host
          (`priv/openthread/protocol.hpp`): `parse_line` followed by the exact
          envelope checks of `request` for `inspect`, `subscribe_state` and
          `management_active_set` requests (the last carrying the 80-byte active
          Dataset of the contract fixture) and of `flow_control` for `flow_open`
          and `report_ack` frames; the rejection of a request with a duplicate
          key; and lines at the parser's limits, 4096 JSON values in 8 KiB and a
          128 KiB string. The host parses each inbound line twice, in its guardian
          and in its worker. Encoding of the host's `ready`, `success` (with a
          State snapshot) and `failure` frames. The unit is one frame; each row
          names the line's size.
        compile:
          - files: [bench/native/protocol_frames.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/priv/openthread", "-I{package}/bench/native/include", "-isystem{root}/packages/wotex-ble/priv/bluez/native"]
      - bench: report_flow
        kind: nanobench
        title: State report credit
        description: >-
          The report credit of the Thread host (`priv/openthread/flow.hpp`):
          credited submission of reports and their exact cumulative
          acknowledgement, for 16 reports on one stream (the per-stream credit)
          and 64 reports on four streams (the session credit); 64 reports on one
          stream, of which 48 wait in the queue and are drained by four
          acknowledgements; and the retirement, with its barrier, of one stream
          holding 16 outstanding and 16 queued reports and of 64 streams holding
          one report each, followed by the acknowledgement that releases them.
          Reports are 212 encoded bytes, newline included, and the writers only
          count them. The unit is one report, or one stream for retirement.
        compile:
          - files: [bench/native/report_flow.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/priv/openthread"]
      - bench: output_lanes
        kind: nanobench
        title: Output lanes
        description: >-
          Admission of 64 report frames into the lane reservations of the Thread
          host's output (`priv/openthread/output.hpp`), and admission followed by
          a flush through `write(2)` to a non-blocking `/dev/null` of 64 report
          frames and of 256 control frames (each lane's frame limit), of 192
          reply, control and report frames interleaved in one output order, and
          of 8 report frames of 128 KiB (the report lane's byte budget). The
          other frames are 212 bytes, newline included. The unit is one frame.
        compile:
          - files: [bench/native/output_lanes.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/priv/openthread"]
      - bench: state_streams
        kind: nanobench
        title: State report streams
        description: >-
          The State subscriptions of the Thread host
          (`priv/openthread/streams.hpp` over the report credit of
          `priv/openthread/flow.hpp`): one coalesced snapshot flush to one stream
          and to 64 streams (the live-stream limit), each followed by the
          acknowledgement of its reports; 64 flushes to one stream, of which 48
          reports wait in the queue and are drained by four acknowledgements; and
          the lifecycle of one subscription: opening, its initial report and
          removal, or opening and five reports under a `queue_limit` of 2, whose
          overflow ends the stream with a `stream_error` frame and its retirement
          barrier. Reports carry a six-field State snapshot and are about 300
          encoded bytes. The unit is one report, or one subscription for the
          lifecycle.
        compile:
          - files: [bench/native/state_streams.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/priv/openthread", "-I{package}/bench/native/include", "-isystem{root}/packages/wotex-ble/priv/bluez/native"]
      - bench: settings_storage
        kind: nanobench
        title: Settings storage lock
        description: >-
          The settings storage of the Thread host (`priv/openthread/storage.hpp`):
          opening an existing owner-only directory and taking the exclusive
          `flock(2)` lock of its lock file, the refusal of a second owner while
          the lock is held, and the creation of a new directory with its lock
          file, removed again within each operation. The directories are in the
          benchmark's scratch directory in the native cache, on the file system
          of the system temporary directory unless `WOTEX_NATIVE_CACHE` names
          another. The unit is one open.
        env:
          WOTEX_THREAD_BENCH_STORAGE: "{scratch}/storage"
        compile:
          - files: [bench/native/settings_storage.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/priv/openthread"]
      # The native build is Linux-only and has no RCP: the script builds the
      # software lane's simulation `ot-rcp` from the workspace's pinned
      # OpenThread tree. The host creates a Thread network interface, so the
      # process needs /dev/net/tun and CAP_NET_ADMIN.
      - bench: host_rcp
        kind: elixir
        title: Thread host against the simulated RCP
        description: >-
          The public `Wotex.Thread` API end to end: the BEAM client, the Port,
          the first-party OpenThread host of the native build and the pinned
          OpenThread simulation RCP over Spinel, on a network the host formed
          as leader with its commissioner active. The jobs inspect the State,
          export and validate the Active Dataset, open a State subscription,
          receive its initial report and close it, send a
          `MGMT_ACTIVE_SET` with a newer Active Timestamp to the leader, and
          add and remove one joiner admission.
        requires: [linux, tun]
        env:
          WOTEX_THREAD_BENCH_WORKSPACE: "{workspace}"
          WOTEX_THREAD_BENCH_SCRATCH: "{scratch}"
  wotex-lab:
    app: wotex_lab
    depends_on:
      - wotex
      - wotex-nx
      - wotex-runtime
      - wotex-directory
      - wotex-binding-http
      - wotex-binding-mqtt
      - wotex-continuum
      - wotex-conformance
    native: true
    native_artifacts:
      - {profile: nerves-rpi4, descriptor: priv/native-artifacts/nerves-rpi4.json}
      - {profile: hosted-investigation, descriptor: priv/native-artifacts/hosted-investigation.json}
    native_bench:
      # A crate of its own: the launcher has binary targets only, so the
      # benchmark includes its config.rs and accounting.rs by path.
      - bench: contained_exec
        kind: criterion
        title: Containment launcher admission and accounting
        description: >-
          The in-process work of the containment launcher
          (`priv/conformance/native`, `wotex-contained-exec`), without a
          contained child: parsing and budget admission of the argument vector
          of the default containment profile, of the largest admitted command
          (29 elements of 4 KiB) and of a memory budget above the ceiling
          (`config.rs`);
          selection of the contained process tree (root, process group,
          descendants that left the group, reparented descendants retained from
          an earlier tick, one reused PID) from synthetic host process tables of
          512, 4,096 and 65,535 rows, the largest table the launcher admits; and
          one observation of this host's process table, the enumeration each
          10 ms supervision tick performs (`accounting.rs`: libproc on macOS,
          `/proc` on Linux).
    # The reference hosts; the Nerves host builds for the host target, never
    # the rpi4 firmware.
    hosts:
      - path: hosts/workbench
      - path: hosts/storybook
      - path: hosts/nerves
        env:
          MIX_TARGET: host
