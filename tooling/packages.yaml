# WoTEx package manifest. The single source for the dependency graph that
# `mix affected` and CI use, plus per-package lane metadata.
#
# depends_on: WoTEx packages this package requires (directly). Dependents are
#   derived. A change in a package selects it and every transitive dependent.
# app: OTP application name (Hex package name).
# native: true when the package builds or vendors native code; its heavy
#   software profile runs only in the explicit native lane.
# native_task: the package's own build task, dispatched by `mix native.build`.
# software_task: the package's own software-profile run task, if any.
# native_check: the suites that give clang-tidy compile commands for the
#   package's first-party C and C++ and run its native tests (`mix native.lint
#   --tidy`, `mix native.test`, the native_lint and native_test tools of the
#   package gate); see Wotex.Workspace.NativeSuite for the keys and
#   placeholders. Every first-party translation unit needs a compile command
#   from some suite. On a host that is not Linux, a suite that requires Linux
#   runs in the Linux container (tooling/native/docker/linux.Dockerfile) when
#   Docker is available.
# native_bench: the package's C, C++ and Rust benchmarks (`mix native.bench`):
#   nanobench drivers (bench/native/<id>.cpp), criterion crates
#   (bench/native/<id>/) and Elixir scripts over the native build
#   (bench/native/<id>_bench.exs), each reported in bench/output/native-<id>.md;
#   see Wotex.Workspace.NativeBench for the keys. Placeholders and requires
#   follow native_check; each nanobench driver also gets a compile-only
#   clang-tidy suite, bench-<id>.
# hosts: applications inside the package directory with their own mix.exs and
#   lock (`path`, relative to the package) and the environment their commands
#   need (`env`). `mix setup` fetches their dependencies; `mix check.fast`
#   compiles, format-checks, lints and tests each one after the package, with
#   WOTEX_PATH_DEPS=1 and MIX_ENV=test. The package's own gate (.check.exs)
#   runs their complete gates.
schema_version: "1.0.0"
# lanes: the toolchains CI runs every package gate on. `skip` names `mix check`
#   tools a lane does not run (passed as `--except TOOL`). The minimum lane runs
#   behaviour tools (compile, tests with coverage, archive and application-free
#   checks); static analysis, whose results depend on the compiler and OTP
#   version, and the native tools, which do not depend on it, run on the
#   current lane only. So do wotex-lab's reference host gates (workbench,
#   storybook_host, nerves_host), each a complete gate that includes formatting and linting:
#   the hosts are applications built with the current toolchain, and the
#   minimum lane verifies library compatibility with the oldest supported
#   Elixir and OTP.
lanes:
  minimum:
    elixir: "1.18.4-otp-27"
    otp: "27.3.4.15"
    skip: [formatter, credo, doctor, dialyzer, ex_doc, mix_audit, hex_audit, diff, api_surface,
           compatibility_review,
           native_format, native_lint, native_test, workbench, storybook_host, nerves_host]
  current:
    elixir: "1.20.2-otp-29"
    otp: "29.0.4"
select_all_on:
  - ".github/**"
  - "tooling/**"
  - "mise.toml"
  - "rust-toolchain.toml"
  - ".clang-format"
  - ".clang-format-ignore"
  - ".clang-tidy"
  - ".gitignore"
  - "mix.exs"
  - "mix.lock"
  - "lib/**"
  - "test/**"
native_artifact:
  schema_version: "1.0.0"
  matrix_limit: 32
  max_slices: 16
  toolchains:
    linux-gcc13:
      identity: "ubuntu-24.04-gcc-13-native-v1"
      inputs: ["tooling/native/docker/linux.Dockerfile"]
    darwin-clang:
      identity: "darwin-aarch64-xcode-command-line-tools-v1"
      inputs: ["tooling/packages.yaml"]
    hosted-beam-rust-linux:
      identity: "linux-erlang-29.0.4-elixir-1.20.2-rust-1.97.1-v1"
      inputs: ["mise.toml", "rust-toolchain.toml"]
    hosted-beam-rust-darwin:
      identity: "darwin-aarch64-erlang-29.0.4-elixir-1.20.2-rust-1.97.1-v1"
      inputs: ["mise.toml", "rust-toolchain.toml"]
    matter-linux-amd64:
      identity: "node-24-bookworm-gcc-12.2.0-gn-v1"
      inputs: ["tooling/native/docker/matter-sdk.Dockerfile", "packages/wotex-matter/test/support/software/sources.json"]
    nerves-rpi4:
      identity: "nerves-rpi4-2.1.1-toolchain-15.3.1"
      inputs: ["packages/wotex-lab/hosts/nerves/mix.exs", "packages/wotex-lab/hosts/nerves/mix.lock"]
  systems:
    host-linux:
      identity: "linux-host-native-v1"
    host-darwin:
      identity: "darwin-host-native-v1"
    ble-virtual-controller:
      identity: "bluez-5.85-btvirt-guest-v1"
      inputs: ["packages/wotex-ble/test/interop/virtual"]
    matter-sdk:
      identity: "connectedhomeip-250a9e6c50ee2068107f3c4808b680f5f2925415"
      inputs: ["packages/wotex-matter/test/support/software/sources.json"]
    nerves-rpi4-2-1-1:
      identity: "nerves-system-rpi4-2.1.1-buildroot-1.34.1"
      inputs: ["packages/wotex-lab/hosts/nerves/mix.lock", "packages/wotex-lab/hosts/nerves/config"]
  targets:
    linux-x86-64:
      operating_system: linux
      architecture: x86_64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: linux-gcc13
      system: host-linux
    linux-aarch64:
      operating_system: linux
      architecture: aarch64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: linux-gcc13
      system: host-linux
    darwin-aarch64:
      operating_system: darwin
      architecture: aarch64
      endianness: little
      libc: libsystem
      abi: darwin
      toolchain: darwin-clang
      system: host-darwin
    hosted-linux-x86-64:
      operating_system: linux
      architecture: x86_64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: hosted-beam-rust-linux
      system: host-linux
    hosted-linux-aarch64:
      operating_system: linux
      architecture: aarch64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: hosted-beam-rust-linux
      system: host-linux
    hosted-darwin-aarch64:
      operating_system: darwin
      architecture: aarch64
      endianness: little
      libc: libsystem
      abi: darwin
      toolchain: hosted-beam-rust-darwin
      system: host-darwin
    ble-guest-x86-64:
      operating_system: linux
      architecture: x86_64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: linux-gcc13
      system: ble-virtual-controller
    matter-linux-x86-64:
      operating_system: linux
      architecture: x86_64
      endianness: little
      libc: glibc
      abi: gnu
      toolchain: matter-linux-amd64
      system: matter-sdk
    nerves-rpi4:
      operating_system: linux
      architecture: aarch64
      endianness: little
      libc: musl
      abi: nerves
      toolchain: nerves-rpi4
      system: nerves-rpi4-2-1-1
  smoke:
    - {package: wotex-ble, profile: production, target: linux-x86-64}
    - {package: wotex-coap, profile: production, target: linux-x86-64}
    - {package: wotex-thread, profile: production, target: linux-x86-64}
packages:
  wotex:
    app: wotex
    depends_on: []
  wotex-runtime:
    app: wotex_runtime
    depends_on: [wotex]
  wotex-directory:
    app: wotex_directory
    depends_on: [wotex]
  wotex-nx:
    app: wotex_nx
    depends_on: [wotex]
  wotex-continuum:
    app: wotex_continuum
    depends_on: [wotex]
  wotex-conformance:
    app: wotex_conformance
    depends_on: []
  wotex-binding-http:
    app: wotex_binding_http
    depends_on: [wotex, wotex-runtime]
  wotex-binding-mqtt:
    app: wotex_binding_mqtt
    depends_on: [wotex, wotex-runtime]
  wotex-bacnet:
    app: wotex_bacnet
    depends_on: [wotex, wotex-runtime]
    native: true
    software_task: wotex.bacnet.software.run
    native_artifacts:
      - {profile: software-peer, descriptor: priv/native-artifacts/software-peer.json}
    native_check:
      - suite: guardian
        compile:
          - files: ["test/interop/native/*.c"]
            flags: [-std=c11]
        test:
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/command.c", -o, "{scratch}/command"]
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/probe.c", -o, "{scratch}/probe"]
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/check.c", -o, "{scratch}/check"]
          - run: ["{scratch}/check", "{scratch}/command", "{scratch}/probe"]
            cd: "{scratch}"
      - suite: cstack
        requires: [docker]
        build: wotex.bacnet.software.build
        prepare:
          - [tar, -xzf, "{workspace}/source.tar.gz", -C, "{scratch}"]
        compile:
          - files: ["test/interop/cstack/*.c"]
            flags: [-std=c11, -D_DARWIN_C_SOURCE, "-I{scratch}/bacnet-stack-3603048350b8ba543ec76cf6aa8a232b3f4d442d/src", -DBACDL_BIP=1, -DMAX_COV_SUBSCRIPTIONS=16, -DMAX_COV_ADDRESSES=16, -DPRINT_ENABLED=0]
        test:
          - [sh, -c, "docker run --rm --entrypoint /normal/wotex-bacnet-peer \"$(cat '{workspace}/image.id')\" --self-test && docker run --rm --entrypoint /normal/wotex-bacnet-peer \"$(cat '{workspace}/image.id')\" --property-self-test"]
    # The production client is Elixir (no native_task), so there are no
    # elixir-kind benchmarks; the C-stack peer itself needs the pinned stack
    # sources and is not benchmarked.
    native_bench:
      - bench: command_guardian
        kind: nanobench
        title: Fixture command guardian
        description: >-
          The POSIX command guardian of the BACnet software lane
          (`test/interop/native/command.c`), compiled with its `main` renamed and run
          in a forked child with an owner-liveness pipe as standard input and a pipe
          to the driver as standard output, as the Mix owner runs the executable
          (the guardian's own `exec` is not measured). The guarded command is the
          driver re-executed in a child mode that exits at once or writes 1 MiB; each
          row collects the output to EOF and checks both exit statuses and the byte
          count, and the rows without the guardian spawn the same command directly
          as the baseline. The unit is one command. The lease row takes and releases
          the advisory fixture lock (`command --lock`) in the benchmark's scratch
          directory; its unit is one lease.
        env:
          WOTEX_BENCH_SCRATCH: "{scratch}"
        compile:
          - files: [bench/native/command_guardian.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror]
          - files: [test/interop/native/command.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wotex_bacnet_command_main]
      - bench: peer_control
        kind: nanobench
        title: C-stack peer control parser
        description: >-
          The control-command parser of the independent BACnet C-stack software peer
          (`test/interop/cstack/control.c`), the part of the peer that compiles
          without the pinned BACnet stack: `peer_parse` on the control datagrams the
          software runner sends (`stats`, `fault` and `quit` with a nonce), accepted
          and rejected. The unit is one command.
        compile:
          - files: [bench/native/peer_control.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/test/interop/cstack"]
          - files: [test/interop/cstack/control.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/test/interop/cstack"]
  wotex-ble:
    app: wotex_ble
    depends_on: [wotex, wotex-runtime]
    native: true
    native_task: wotex.ble.native.build
    software_task: wotex.ble.software.run
    native_artifacts:
      - {profile: production, descriptor: priv/native-artifacts/production.json}
      - {profile: sanitizers, descriptor: priv/native-artifacts/sanitizers.json}
      - {profile: virtual-controller, descriptor: priv/native-artifacts/virtual-controller.json}
    native_check:
      - suite: portable
        compile:
          - files: [priv/bluez/native/build_command.c, priv/bluez/native/custody.c, "test/native/*.c", "test/interop/native/*.c"]
            flags: [-std=c11]
          - files: [test/native/bytes_test.cpp, test/native/credit_test.cpp, test/native/frame_test.cpp, test/native/output_test.cpp, test/native/pages_test.cpp, test/native/reports_test.cpp, test/native/scripted_host.cpp]
            flags: [-std=c++17, "-I{package}/priv/bluez/native"]
          - files: [test/native/flow_source.cpp]
            flags: [-std=c++17, "-I{package}/priv/bluez/native", -DWOTEX_FLOW_CALLBACKS=4, -DWOTEX_FLOW_VALUE_BYTES=20]
          - files: [test/interop/virtual/public_peer.cpp]
            flags: [-std=c++17, "-I{package}/priv/bluez/native/vendor", "pkg-config:gio-2.0"]
      - suite: libdbus
        requires: [linux]
        build: wotex.ble.native.build
        compile:
          - files: [priv/bluez/native/main.cpp, test/native/bus_test.cpp]
            flags: [-std=c++17, "-I{package}/priv/bluez/native", "-I{workspace}/sources/libdbus/dbus-1.16.2", "-I{workspace}/build/libdbus"]
        test:
          - run: [mix, test, --only, interop, test/interop/native_bus_test.exs, test/interop/native_host_test.exs]
            env:
              MIX_ENV: test
              WOTEX_PATH_DEPS: "1"
              WOTEX_BLE_DBUS_SOURCE: "{workspace}/sources/libdbus/dbus-1.16.2"
              WOTEX_BLE_DBUS_BUILD: "{workspace}/build/libdbus"
              WOTEX_BLE_NATIVE_WORKSPACE: "{workspace}"
    # The components that compile without libdbus, then the SDK paths through
    # the public API, which need the software lane's private bus, BlueZ,
    # virtual controllers and GATT peer on a Linux host.
    native_bench:
      - bench: frame
        kind: nanobench
        title: Protocol-v1 framing and bounded JSON
        description: >-
          Protocol-v1 framing of the native host (`priv/bluez/native/frame.hpp`):
          the bounded parse of one request line (health, read, a write carrying
          a 512-byte value, and a line of the 131,072-byte maximum), the
          rejection of an array beyond the 1,024-entry bound, and the host's
          admission path for 256 pipelined requests: 8 KiB reads through the
          incremental line decoder, the bounded parse and the dispatch-sequence
          check. The unit is one line.
        compile:
          - files: [bench/native/frame.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: bytes
        kind: nanobench
        title: Attribute byte envelopes
        description: >-
          Attribute byte envelopes (`priv/bluez/native/bytes.hpp`): canonical
          base64 decoding of a byte envelope into attribute bytes within the
          512-byte ATT bound, and encoding of attribute bytes into an envelope,
          for 20-byte (default ATT MTU), 244-byte (LE Data Length Extension) and
          512-byte (ATT maximum) values. The unit is one value.
        compile:
          - files: [bench/native/bytes.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: output
        kind: nanobench
        title: Bounded serialization and native output
        description: >-
          Bounded serialization and nonblocking output
          (`priv/bluez/native/output.hpp`): validation and encoding of a value
          report envelope carrying a 20-byte or a 512-byte value, and admission
          followed by a flush through `write(2)` to `/dev/null` of 64 read
          replies, each into its reserved slot, and of 64 report frames. The
          unit is one frame.
        compile:
          - files: [bench/native/output.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: credit
        kind: nanobench
        title: Cumulative report credit
        description: >-
          Cumulative report credit (`priv/bluez/native/credit.hpp`): reservation
          of 320-byte reports and the validated `report_ack` frame that returns
          their credit, for one stream filling its 16-report window and for 64
          streams with one report each, and the credit lifecycle of one stream
          (open, reserve, retire, acknowledge). The unit is one report, or one
          stream.
        compile:
          - files: [bench/native/credit.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: report_queue
        kind: nanobench
        title: Unsent-report queue
        description: >-
          The unsent-report queue (`priv/bluez/native/report_queue.hpp`)
          holding 20-byte values charged 320 bytes each: admission of 64
          reports and a drain that dispatches them all, on one stream and on 8
          streams; a drain in which 4 of 8 streams lack credit, whose reports
          are then discarded; and admission of 64 reports on one stream
          followed by its discard, the path of a silenced stream. The unit is
          one report.
        compile:
          - files: [bench/native/report_queue.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: pages
        kind: nanobench
        title: Discovery pages
        description: >-
          Discovery paging (`priv/bluez/native/pages.hpp`): parsing of the page
          request and construction of the bounded page reply, which re-encodes
          the reply after each added characteristic to stay within the frame
          bound, for a 16-characteristic snapshot in one page, the first
          64-entry page of 256 characteristics with a new cursor, and a walk of
          the 1,024-characteristic maximum in 16 pages. Each snapshot is a new
          discovery generation; cursor tokens come from a counter instead of
          the host's OS random source. The unit is one page.
        compile:
          - files: [bench/native/pages.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: reports
        kind: nanobench
        title: Native report path
        description: >-
          The native report path (`priv/bluez/native/reports.hpp` over the
          credit, queue, output, byte-envelope and error-value components):
          publication of value callbacks, a flush through `write(2)` to
          `/dev/null` and the owner's cumulative acknowledgement, for 16 reports
          of 20 or 512 bytes that fit one stream's credit window and for 64
          reports of 20 bytes that exceed it, so that 48 wait in the queue and
          drain as four acknowledgements return credit; and opening and
          retiring a subscription, with or without a terminal error control.
          The unit is one report, or one subscription.
        compile:
          - files: [bench/native/reports.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic, "-I{package}/priv/bluez/native"]
      - bench: custody
        kind: nanobench
        title: Runtime guardian relay and sessions
        description: >-
          The runtime guardian (`priv/bluez/native/custody.c`) with the BLE
          profile's limits (500 ms cleanup, 131,072 input and 65,536 output
          bytes): the round trip of a 256-byte line and of a 64 KiB burst from
          the owner through the guardian to an echoing SDK child (`/bin/cat`)
          and back, and whole sessions: start, SDK exit and reap
          (`/usr/bin/true`), and start, owner EOF and teardown (`/bin/cat`). The
          driver forks and runs the guardian's `main` in the child, so the
          guardian's own `exec` is not measured; the SDK child's is.
        env:
          WOTEX_BLE_BENCH_SCRATCH: "{scratch}"
        compile:
          - files: [bench/native/custody.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic]
          - files: [priv/bluez/native/custody.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wbl_custody_main]
      - bench: command_guardian
        kind: nanobench
        title: Build command guardian
        description: >-
          The build and fixture command guardian
          (`priv/bluez/native/build_command.c`) with the native build's limits
          (600 s, 16 MiB of output, 5,000 ms cleanup): running `/usr/bin/true`
          in its own process group, and forwarding the 1 MiB output of
          `/bin/cat` through the guardian's bounded queue to the owner. The
          driver forks and runs the guardian's `main` in the child, so the
          guardian's own `exec` is not measured; the command's is. The guardian
          polls at most 10 ms at a time and observes the command's exit only
          after a poll: when it reads the output's end before the exit is
          observable, it waits out one poll interval, so the time per command
          is bimodal and its median varies between runs.
        env:
          WOTEX_BLE_BENCH_SCRATCH: "{scratch}"
        compile:
          - files: [bench/native/command_guardian.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -pedantic]
          - files: [priv/bluez/native/build_command.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wbl_command_main]
      - bench: gatt_procedure
        kind: elixir
        title: GATT procedures through the native host
        description: >-
          GATT procedures through the public API on a persistent BlueZ session
          (`Wotex.BLE.BlueZ` with the native host and runtime guardian of the
          `--workspace` build) against the software lane's private D-Bus bus,
          `bluetoothd`, two virtual controllers and GATT peer:
          `Wotex.BLE.read/3` of a 2-byte value as bytes and as `uint16`, and an
          acknowledged `Wotex.BLE.write/4` of that value. Needs a Linux host
          running that environment (`WOTEX_BLE_SOFTWARE_CONFIG`).
        requires: [linux]
        env:
          WOTEX_BLE_NATIVE_WORKSPACE: "{workspace}"
      - bench: notification
        kind: elixir
        title: Notification round trips through the native host
        description: >-
          Notification and indication round trips through the public API on a
          persistent BlueZ session against the software lane's private D-Bus
          bus, `bluetoothd`, two virtual controllers and GATT peer: from the
          request on the peer's control socket that emits a new value to the
          subscriber's `{:wotex_ble, reference, {:ok, value, metadata}}`
          message, across the virtual link, BlueZ, the native host, its runtime
          guardian and the report credit window. Needs a Linux host running
          that environment (`WOTEX_BLE_SOFTWARE_CONFIG`).
        requires: [linux]
        env:
          WOTEX_BLE_NATIVE_WORKSPACE: "{workspace}"
  wotex-coap:
    app: wotex_coap
    depends_on: [wotex, wotex-runtime]
    native: true
    native_task: wotex.coap.native.build
    software_task: wotex.coap.software.run
    native_artifacts:
      - {profile: production, descriptor: priv/native-artifacts/production.json}
      - {profile: software-peer, descriptor: priv/native-artifacts/software-peer.json}
    native_check:
      # The software build compiles the helper against the pinned libcoap and
      # builds and runs the twelve fault and vector executables; the headers
      # it deletes afterwards are regenerated from its verified archive.
      - suite: libcoap
        build: wotex.coap.software.build
        prepare:
          - [tar, -xzf, "{workspace}/native/downloads/libcoap.tar.gz", -C, "{scratch}"]
          - [cmake, -S, "{scratch}/libcoap-7cf7465b784baded4de183290c547d582becfd28", -B, "{scratch}/libcoap", -DENABLE_OSCORE=ON, -DENABLE_DTLS=ON, -DDTLS_BACKEND=openssl, -DBUILD_SHARED_LIBS=OFF, -DENABLE_DOCS=OFF, -DENABLE_EXAMPLES=OFF, -DENABLE_TESTS=OFF]
        compile:
          - files: ["native/oscore/*.c"]
            flags: [-std=c11, -DWCO_WITH_LIBCOAP, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "-I{scratch}/libcoap/include", "-I{scratch}/libcoap-7cf7465b784baded4de183290c547d582becfd28/include", "pkg-config:openssl"]
          - files: ["test/native/*.c"]
            flags: [-std=c11, -DWCO_STORE_TEST, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "-I{scratch}/libcoap/include", "-I{scratch}/libcoap-7cf7465b784baded4de183290c547d582becfd28/include", "pkg-config:openssl"]
        test:
          - ["{workspace}/bin/faults/oscore-json"]
          - ["{workspace}/bin/faults/oscore-frame"]
          - ["{workspace}/bin/faults/oscore-body"]
          - ["{workspace}/bin/faults/oscore-credit"]
          - ["{workspace}/bin/faults/oscore-command"]
          - ["{workspace}/bin/faults/oscore-identity"]
          - ["{workspace}/bin/faults/oscore-store"]
          - ["{workspace}/bin/faults/oscore-store-send"]
          - ["{workspace}/bin/faults/oscore-sequence"]
          - ["{workspace}/bin/faults/oscore-block-limit"]
          - ["{workspace}/bin/faults/oscore-protection"]
          - ["{workspace}/bin/faults/oscore-worker-exchange", "{workspace}/native/bin/wotex-coap-oscore"]
    # The helper's SDK-free components (nanobench, built with the helper's
    # flags against yyjson and OpenSSL), then the helper end to end through the
    # public API against the software lane's libcoap peer (elixir), with
    # single-datagram exchanges only (see bench/native/oscore_request_bench.exs).
    native_bench:
      - bench: oscore_command
        kind: nanobench
        title: OSCORE helper command input
        description: >-
          The native OSCORE helper's input path for one command line from its owner, as
          the worker's `consume` runs it: LF framing (`native/oscore/frame.c`), parsing
          into the fixed 2 MiB yyjson pool with its duplicate-member, depth and number
          checks (`json.c`), decoding against the per-operation allowlists (`command.c`,
          with `body.c` for byte envelopes), then erasure of the command and of the
          parser pool. One line of each operation, sixteen coalesced lines delivered in
          4 KiB reads, a line rejected for a duplicate member, and the pool erasure
          alone, which runs twice for every line. The unit is one line.
        compile:
          - files: [bench/native/oscore_command.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "pkg-config:openssl"]
          - files: [native/oscore/frame.c, native/oscore/json.c, native/oscore/command.c, native/oscore/body.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "pkg-config:openssl"]
          - files: [native/oscore/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1]
        link: ["pkg-config:openssl"]
      - bench: oscore_body
        kind: nanobench
        title: OSCORE helper upload body
        description: >-
          The upload body of the native OSCORE helper (`native/oscore/body.c`): canonical
          base64 validation and decoding of one 32 KiB byte envelope, and whole uploads
          of 1 KiB, 64 KiB and 1 MiB (the limit) as the worker admits them:
          `wco_body_begin` (allocation), one `wco_body_chunk` per chunk of at most
          32 KiB, `wco_body_end` (SHA-256 verification), data access and
          `wco_body_clear` (erasure). The unit is one decoded byte.
        compile:
          - files: [bench/native/oscore_body.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "pkg-config:openssl"]
          - files: [native/oscore/json.c, native/oscore/body.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1, "-I{package}/native/oscore", "pkg-config:openssl"]
          - files: [native/oscore/vendor/yyjson/yyjson.c]
            flags: [-std=c11, -DYYJSON_DISABLE_NON_STANDARD=1, -DYYJSON_DISABLE_UTILS=1, -DYYJSON_DISABLE_INCR_READER=1]
        link: ["pkg-config:openssl"]
      - bench: oscore_report
        kind: nanobench
        title: OSCORE helper report credit and freshness
        description: >-
          Admission of Observe reports in the native OSCORE helper: the cumulative
          report credit of one generation (`native/oscore/credit.c`), with eight reports
          assigned, written and acknowledged per window and the exhausted window
          checked, and the RFC 7641 freshness decision (`observation.c`) for the next
          in-order notification, a replay, a 24-bit wraparound and a changed
          Content-Format. The unit is one report.
        compile:
          - files: [bench/native/oscore_report.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/native/oscore"]
          - files: [native/oscore/credit.c, native/oscore/observation.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/native/oscore"]
      - bench: oscore_store
        kind: nanobench
        title: OSCORE context identity and store
        description: >-
          The durable OSCORE context store of the native helper: deriving the storage
          identity of the RFC 8613 appendix C.1 client context
          (`native/oscore/identity.c`: three HKDF-SHA-256 derivations and three SHA-256
          digests through OpenSSL), consuming that identity in a new private store
          directory (lock file, first registry write with `fsync(2)`, rename and
          directory `fsync(2)`), and reserving the next sequence boundary, which
          rewrites the registry the same way, in a store holding its own context only
          and in one holding 1,024 contexts (`store.c`). The stores live below the
          benchmark's scratch directory in the native cache, so the timings include
          that filesystem's `fsync(2)`.
        env:
          WCO_BENCH_SCRATCH: "{scratch}"
        compile:
          - files: [bench/native/oscore_store.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror, "-I{package}/native/oscore", "pkg-config:openssl"]
          - files: [native/oscore/identity.c, native/oscore/store.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, "-I{package}/native/oscore", "pkg-config:openssl"]
        link: ["pkg-config:openssl"]
      - bench: oscore_custody
        kind: nanobench
        title: OSCORE helper process custody
        description: >-
          The process custody of the native OSCORE helper (`native/oscore/custody.c`),
          started with the arguments `main.c` gives it (500 ms cleanup deadline, 256 KiB
          queues) and the benchmark executable as an echo worker: one whole lifecycle
          (guardian and worker start, one 256-byte line echoed, a `close` line, worker
          exit and reap with exit status 0), the same lifecycle of the worker spawned
          directly as the baseline, and round trips of 256-byte, 4 KiB and 32 KiB lines
          from the owner through the guardian to a running worker and back. The
          lifecycle rows include the forks and the worker's exec, and the guardian's
          10 ms poll interval while it waits for the worker's exit.
        compile:
          - files: [bench/native/oscore_custody.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror]
          - files: [native/oscore/custody.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror]
      - bench: oscore_request
        kind: elixir
        title: Protected unary requests through the native helper
        description: >-
          `Wotex.CoAP.get/3` and `Wotex.CoAP.put/4` on one native OSCORE session (the
          helper `wotex.coap.native.build` built, under custody) against libcoap
          4.3.5's `coap-server` on loopback, built as the software lane builds its
          same-stack peer (the workspace's verified archive and the lane's CMake
          options) and started with the lane's OSCORE context and arguments, but
          warnings-only logging: GETs of 64-byte and 512-byte representations and a
          PUT of a 512-byte body, each request and response one datagram. Each call
          returns after the helper has relayed the complete, verified response to
          the session.
        env:
          WOTEX_COAP_BENCH_WORKSPACE: "{workspace}"
          WOTEX_COAP_BENCH_SCRATCH: "{scratch}"
      - bench: oscore_observe
        kind: elixir
        title: Protected Observe notifications through the native helper
        description: >-
          One native OSCORE observation (`Wotex.CoAP.subscribe/2`, the helper
          `wotex.coap.native.build` built, under custody) of a dynamic resource on
          libcoap 4.3.5's `coap-server` on loopback, built and started as for the
          unary benchmark. Each iteration changes the resource with an unprotected
          UDP PUT from a second session and waits until the subscription's receiver
          holds the protected notification carrying the new 16-byte or 512-byte value:
          the PUT exchange, the peer's notification, its OSCORE verification and
          freshness check in the helper, report credit and the relay to the receiver.
        env:
          WOTEX_COAP_BENCH_WORKSPACE: "{workspace}"
          WOTEX_COAP_BENCH_SCRATCH: "{scratch}"
  wotex-matter:
    app: wotex_matter
    depends_on: [wotex, wotex-runtime]
    native: true
    native_task: wotex.matter.native.build
    software_task: wotex.matter.software.run
    native_artifacts:
      - {profile: production, descriptor: priv/native-artifacts/production.json}
      - {profile: software-peer, descriptor: priv/native-artifacts/software-peer.json}
    native_check:
      - suite: value
        prepare:
          - [cmake, -S, "{package}/native", -B, "{scratch}/value", -DCMAKE_EXPORT_COMPILE_COMMANDS=ON]
        compile_commands: ["{scratch}/value/compile_commands.json"]
        test:
          - [cmake, --build, "{scratch}/value", --parallel, "4"]
          - [ctest, --test-dir, "{scratch}/value", --output-on-failure]
      # The build compiles the SDK-bound sources in the pinned linux/amd64
      # container and runs their CTest suite, normal and sanitized. clang-tidy
      # analyses them in that image (plus LLVM) on the compile commands ninja
      # exports from the GN and CMake builds of the workspace; the package's
      # own native/ directories are mounted over the copy the GN build compiled.
      - suite: sdk
        requires: [docker]
        build: wotex.matter.native.build
        container:
          dockerfile: tooling/native/docker/matter-sdk.Dockerfile
          platform: linux/amd64
          volumes:
            - "{workspace}:/work"
            - "{package}:/src"
            - "{package}/native/src:/work/sdk/examples/wotex-matter-host/src"
            - "{package}/native/include:/work/sdk/examples/wotex-matter-host/include"
            - "{package}/native/testing:/work/sdk/examples/wotex-matter-host/testing"
        prepare:
          - run: [ninja, -C, /work/build, -t, compdb]
            stdout: "{scratch}/gn.json"
          - run: [ninja, -C, /work/cmake-normal, -t, compdb]
            stdout: "{scratch}/cmake.json"
        compile_commands: ["{scratch}/gn.json", "{scratch}/cmake.json"]
    native_bench:
      - bench: value_bounds
        kind: nanobench
        title: Matter value bounds
        description: >-
          The SDK-free checks the Matter controller host applies to every value
          and request: descriptor lookup, conversion of SDK values to TLV elements
          and their validation (`native/src/value.cpp`) for OnOff, a Thermostat
          setpoint, a 12-cluster ServerList and a 64-endpoint PartsList;
          validation of an Access Control List write of four entries with four
          subjects and two targets each, and of a 64-path Descriptor read with
          its response (`native/src/interaction.cpp`); and the commissioning
          request and commissioning-window checks
          (`native/src/commissioning.cpp`). The unit is one value or one
          request.
        compile:
          - files: [bench/native/value_bounds.cpp, native/src/value.cpp, native/src/interaction.cpp, native/src/commissioning.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include"]
      # The host benchmarks compile native/src/protocol.cpp, which includes
      # nlohmann/json: bench/native/include/nlohmann/json.hpp includes the
      # identical pinned header wotex-ble vendors.
      - bench: host_requests
        kind: nanobench
        title: Matter host request dispatch
        description: >-
          `HostProtocol::ProcessLine` of the Matter controller host
          (`native/src/protocol.cpp`) for one request line of each kind: the
          bounded JSON parse, envelope, request-id and parameter validation, the
          call into the controller backend and the encoded reply frame. The
          requests are a health check, a read of OnOff, a batch read of the four
          Descriptor attributes on four endpoints, writes of a Thermostat
          setpoint and of a four-entry Access Control List, and an OnOff Toggle
          invocation. A scripted backend answers as a node would, so the rows
          measure the host's JSON and TLV handling around the SDK. The unit is
          one request.
        compile:
          - files: [bench/native/host_requests.cpp, native/src/value.cpp, native/src/interaction.cpp, native/src/subscription.cpp, native/src/commissioning.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include"]
          - files: [native/src/protocol.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include", "-I{package}/bench/native/include", "-isystem{root}/packages/wotex-ble/priv/bluez/native"]
      - bench: host_session
        kind: nanobench
        title: Matter host session round trips
        description: >-
          Request round trips through a complete session of the Matter
          controller host: `RunHost` (`native/src/protocol.cpp`) reads frames
          from its input pipe through `BoundedInput`
          (`native/include/wotex_matter/input.hpp`), dispatches them and hands
          each reply to its bounded output writer thread, which writes it to the
          output pipe. A second thread drives the session as the BEAM Port does,
          one request at a time: it reads the ready frame, opens the controller,
          sends 256 health checks, OnOff reads or Thermostat setpoint writes,
          reading each reply before the next request, and closes. A scripted
          backend answers the interactions. The unit is one request round trip;
          the session set-up is amortised over its 256 requests.
        compile:
          - files: [bench/native/host_session.cpp, native/src/value.cpp, native/src/interaction.cpp, native/src/subscription.cpp, native/src/commissioning.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include"]
          - files: [native/src/protocol.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include", "-I{package}/bench/native/include", "-isystem{root}/packages/wotex-ble/priv/bluez/native"]
      - bench: report_flow
        kind: nanobench
        title: Matter subscription report flow
        description: >-
          Subscription reports in the Matter controller host, whose session
          credit is 64 reports and 1 MiB and whose stream credit is 16 reports:
          `ReportCreditManager` (`native/src/subscription.cpp`) transmitting a
          full window of 64 reports over four streams and releasing it with one
          acknowledgement, and 64 reports to one stream, of which 48 wait for
          credit and are drained by acknowledgements; `SubscriptionBuffer`
          assembling a subscription's initial report of four paths and 60
          single-path changes; and the complete path through `HostProtocol`
          (`native/src/protocol.cpp`): the controller's report callback, the
          encoded `subscription_report` frame and credit accounting for 16
          reports, then the `report_ack` line that returns their credit. The
          unit is one report.
        compile:
          - files: [bench/native/report_flow.cpp, native/src/value.cpp, native/src/interaction.cpp, native/src/subscription.cpp, native/src/commissioning.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include"]
          - files: [native/src/protocol.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Wpedantic, -Werror, "-I{package}/native/include", "-I{package}/bench/native/include", "-isystem{root}/packages/wotex-ble/priv/bluez/native"]
      # --workspace must hold a software build (`mix pkg wotex-matter
      # wotex.software.build --workspace DIR`): the native build alone has no
      # peers. The script runs the measurement in the software lane's
      # linux/amd64 container.
      - bench: controller_peer
        kind: elixir
        title: Matter controller against the all-clusters peer
        description: >-
          The public `Wotex.Matter` API end to end against the pinned
          connectedhomeip all-clusters example, commissioned on the network by
          a persistent controller: the BEAM client, the Port, the first-party
          controller host and the SDK controller, and the peer. The jobs read
          OnOff, read the four Descriptor attributes of two endpoints in one
          batch, discover the endpoints, write the Thermostat
          OccupiedHeatingSetpoint, invoke the OnOff Toggle command, and invoke
          Toggle and wait for the resulting OnOff subscription report. The
          controller host and the peer are the x86_64 Linux builds of
          `mix wotex.software.build`, so the benchmark runs in the software
          lane's linux/amd64 hexpm/elixir container on a private Docker network;
          on an arm64 host that container's user space is translated (Rosetta
          under OrbStack), which slows the BEAM, the host and the peer alike.
          The controller host writes the SDK's log to its standard error, here
          a file, as it does in production; that cost is part of every
          measurement.
        requires: [docker]
        env:
          WOTEX_MATTER_BENCH_WORKSPACE: "{workspace}"
          WOTEX_MATTER_BENCH_SCRATCH: "{scratch}"
  wotex-modbus:
    app: wotex_modbus
    depends_on: [wotex, wotex-runtime]
    native: true
    native_artifacts:
      - {profile: software-peer, descriptor: priv/native-artifacts/software-peer.json}
    software_task: wotex.modbus.software.run
    native_check:
      - suite: guardian
        compile:
          - files: ["test/interop/native/*.c"]
            flags: [-std=c11]
        test:
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/command.c", -o, "{scratch}/command"]
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/probe.c", -o, "{scratch}/probe"]
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, "{package}/test/interop/native/check.c", -o, "{scratch}/check"]
          - [cc, -std=c11, -O1, -g, -Wall, -Wextra, -Werror, "-fsanitize=address,undefined", -fno-sanitize-recover=all, -fno-omit-frame-pointer, -Dsetpgid=wmb_fault_setpgid, "{package}/test/interop/native/command.c", "{package}/test/interop/native/group_fault.c", -o, "{scratch}/command-fault"]
          - run: ["{scratch}/check", "{scratch}/command", "{scratch}/probe", "{scratch}/command-fault"]
            cd: "{scratch}"
      - suite: libmodbus
        requires: [docker]
        build: wotex.modbus.software.build
        prepare:
          - [tar, -xzf, "{workspace}/source.tar.gz", -C, "{scratch}"]
          - [mkdir, -p, "{scratch}/include/modbus"]
          - [cp, "{scratch}/libmodbus-9af6c16074df566551bca0a7c37443e48f216289/src/modbus.h", "{scratch}/libmodbus-9af6c16074df566551bca0a7c37443e48f216289/src/modbus-rtu.h", "{scratch}/libmodbus-9af6c16074df566551bca0a7c37443e48f216289/src/modbus-tcp.h", "{scratch}/include/modbus/"]
          - run: [sed, -e, "s/@LIBMODBUS_VERSION_MAJOR@/3/;s/@LIBMODBUS_VERSION_MINOR@/1/;s/@LIBMODBUS_VERSION_MICRO@/12/;s/@LIBMODBUS_VERSION@/3.1.12/g", "{scratch}/libmodbus-9af6c16074df566551bca0a7c37443e48f216289/src/modbus-version.h.in"]
            stdout: "{scratch}/include/modbus/modbus-version.h"
        compile:
          - files: [test/interop/libmodbus/server.c]
            flags: [-std=c11, -D_POSIX_C_SOURCE=200809L, "-I{scratch}/include"]
    # The command guardian only: the libmodbus fixture server needs the SDK, and
    # without a native_task the package has no elixir benchmarks.
    native_bench:
      - bench: command_guardian
        kind: nanobench
        title: Software-lane command guardian
        description: >-
          The command guardian of the software lane (`test/interop/native/command.c`,
          linked with its `main` renamed), which runs one command in its own process
          group under a deadline, a bound on its combined output and owner liveness on
          standard input. Eight invalid argument vectors rejected in process (status
          126); then, with the benchmark executable as the command, that command
          spawned directly as the baseline and, with the guardian in a child process, a
          command that exits at once, relays of 64 KiB and 1 MiB, 1 MiB stopped at a
          64 KiB output bound (status 125), a waiting command stopped at a 20 ms
          deadline (status 124), and the fixture lock acquired and released (`--lock`).
          Each process row reads the output to its end and checks the exit status and
          the byte count; it includes the forks and the command's exec, and the
          guardian polls every 10 ms, which quantizes these rows.
        env:
          WMB_BENCH_SCRATCH: "{scratch}"
        compile:
          - files: [bench/native/command_guardian.cpp]
            flags: [-std=c++17, -Wall, -Wextra, -Werror]
          - files: [test/interop/native/command.c]
            flags: [-std=c11, -Wall, -Wextra, -Werror, -Dmain=wmb_command_main]
  wotex-opcua:
    app: wotex_opcua
