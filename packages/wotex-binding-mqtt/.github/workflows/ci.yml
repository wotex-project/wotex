name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix check

      - uses: actions/upload-artifact@v4
        with:
          name: wotex-binding-mqtt-hex
          path: wotex_binding_mqtt-*.tar
          if-no-files-found: error
