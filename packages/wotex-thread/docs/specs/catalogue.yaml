    compatibility_classification: "Python-free first-party Mix native build completed and emitted a ready frame on Debian 12 arm64; pinned downloads, SDK fixes, guardian and content-bound manifest have scoped evidence. The shared native report-flow owner and BEAM ledger execute native-port-v1 F01–F05, F07–F10, F14 and F15 through a contract driver on macOS and Linux sanitizer lanes; the host admits flow_open/report_ack with reserved output lanes and F06 executes against the real host on both Linux arm64 BEAM lanes. mix wotex.software.build and mix wotex.software.run execute the manifest-bound normal and sanitizer lanes on Linux arm64 with Elixir 1.18.4/OTP 27.3.4.15 and 1.20.2/OTP 29.0.4. The same tasks pass on emulated Linux x86_64 for both BEAM lanes with real-host process ownership cases. Native State subscriptions supply credited reports, retirement barriers and stream errors on all four lanes, and F11–F13 execute there through a test-only callback source. C09 stress, dependency audit and clean archive validation remain open."
