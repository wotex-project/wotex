name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wotex-continuum
    env:
      MIX_ENV: test
      WOTEX_PATH_DEPS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5"
    steps:
      - uses: actions/checkout@v4
        with:
          path: wotex-continuum
      - uses: actions/checkout@v4
        with:
          repository: wotex-project/wotex
          ref: 3676e71ed5b3b15e002bf4a05cc1b856a75dd8d9
          path: wotex
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            wotex-continuum/deps
            wotex-continuum/_build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('wotex-continuum/mix.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --only test
      - run: mix check
      - run: ./scripts/check_public_boundary.sh
