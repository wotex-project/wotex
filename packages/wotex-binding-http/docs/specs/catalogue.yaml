      - "test/wotex/binding/http/value_test.exs"
      - "test/wotex/binding/http/library_contract_test.exs"
    compatibility_classification: "immutable credential-free values and explicit client callbacks"
  - id: "WBH.03"
    version: "1.0.0"
    path: "docs/specs/WBH.03-sse-subscriptions.md"
    implementation_status: "partial"
    standards:
      - {name: "HTML Server-Sent Events", revision: "Living Standard; repository baseline observed 2026-09-02", claim: "framed-event adaptation only; parser/reconnect external"}
      - {name: "W3C WoT Profiles", revision: "Working Draft 2025-11-04", claim: "SSE mapping guidance only"}
    requires: ["WBH.01", "WBH.02", "wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.Binding.HTTP.SSE.Event", "Wotex.Binding.HTTP.Notification", "Wotex.Binding.HTTP.Subscription", "Wotex.Binding.HTTP.Transport"]
    executable_evidence:
      - "test/wotex/binding/http/transport_test.exs"
      - "test/wotex/binding/http/integration_test.exs"
    compatibility_classification: "exact configuration-instance lifecycle; recovery evidence WBH-C02/C03 remains"
