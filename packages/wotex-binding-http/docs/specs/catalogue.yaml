    path: "docs/specs/WBH.01-http-transport.md"
    implementation_status: "implemented"
    standards:
      - {name: "W3C WoT Thing Description 1.1", revision: "Recommendation 2023-12-05", claim: "named HTTP Form subset"}
      - {name: "W3C WoT Profiles", revision: "Working Draft 2025-11-04", claim: "action-status mapping guidance only; no conformance"}
    requires: ["WBH.02", "wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.Binding.HTTP", "Wotex.Binding.HTTP.Form", "Wotex.Binding.HTTP.Transport"]
