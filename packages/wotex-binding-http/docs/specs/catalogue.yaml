      - "test/wotex/binding/http/transport_test.exs"
    compatibility_classification: "nine-operation versioned HTTP profile; draft-derived choices remain explicit"
  - id: "WBH.02"
    version: "1.0.0"
    path: "docs/specs/WBH.02-client-port-and-values.md"
    implementation_status: "implemented"
    standards:
      - {name: "HTTP Semantics", revision: "RFC 9110, 2022-06", claim: "field/method/status subset; wire client external"}
      - {name: "JSON", revision: "RFC 8259, 2017-12", claim: "bounded codec adaptation; not streaming parser"}
    requires: ["wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.Binding.HTTP.Client", "Wotex.Binding.HTTP.Config", "Wotex.Binding.HTTP.Request", "Wotex.Binding.HTTP.Response", "Wotex.Binding.HTTP.Headers", "Wotex.Binding.HTTP.Codec", "Wotex.Binding.HTTP.Error"]
