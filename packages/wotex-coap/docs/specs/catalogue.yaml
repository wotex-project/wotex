    standards: [{"name": "Native SDK", "revision": "libcoap 4.3.5 commit 7cf7465b784baded4de183290c547d582becfd28", "claim": "Planned explicit C Port owner and Mix build/run tasks"}, {"name": "IETF OSCORE", "revision": "RFC 8613 2019-07", "claim": "Planned fixed-suite native libcoap profile with single-generation durable context admission"}]
    requires: ["WCO.00", "WCO.10", "WCO.11", "WCO.12"]
    implementation_modules: ["Wotex.CoAP.Error", "Wotex.CoAP.Native.Body", "Wotex.CoAP.Native.Report", "Wotex.CoAP.Native.ReportLedger", "Wotex.CoAP.Native.Wire", "Wotex.CoAP.NativeBackend"]
    executable_evidence: ["test/native/oscore_sequence_test.c", "test/native/oscore_identity_test.c", "test/native/oscore_store_test.c", "test/native/oscore_store_send_test.c", "test/native/oscore_json_test.c", "test/native/oscore_frame_test.c", "test/native/oscore_body_test.c", "test/native/oscore_credit_test.c", "test/native/oscore_block_limit_test.c", "test/native/oscore_protection_test.c", "test/wotex/coap/native/custody_test.exs", "test/native/oscore_command_test.c", "test/wotex/coap/native_backend_test.exs", "test/wotex/coap/native_body_test.exs", "test/wotex/coap/native_report_ledger_test.exs", "test/wotex/coap/native_report_test.exs", "test/wotex/coap/native_wire_test.exs"]
    compatibility_classification: "Native sender reservation, directional key-space identity and durable registry primitives pass macOS/Linux sanitizer assertions identified by native-sequence-v1.json and native-store-v1.json. Strict fixed-pool JSON and bounded split/coalesced line primitives have native-json-v1.json evidence. Native body/hash and cumulative credit primitives have native-body-credit-v1.json evidence. Shared SDK block-engine allocation and no-application-restart faults have native-block-v1.json evidence. Native authenticated-response admission has native-protection-v1.json evidence. Structural native command admission has native-command-v1.json evidence. NativeBackend verifies the bounded native manifest and executable content identity without process creation. Native.Wire validates the pure BEAM receive boundary for lines, ready identity and request/control responses; its tests cover receiver-side native-v1 F01, F02, F08 and F10-F13. Native.Body executes pure F03, F04 and F14 assembly outcomes with poisoned failure state and complete-body release. Native.Report validates common body/report/terminal envelopes and the F15 payload-threshold component. Native.ReportLedger enforces the BEAM-side contiguous eight-frame/1-MiB credit window, one retained report and one in-flight cumulative credit command. Opaque custody has thirteen actual ExUnit/native cases; its 200-launch leak-audit stress remains unaccepted. Production worker/Port/report-credit integration, live replay and Mix orchestration remain unimplemented. The complete native-v1 helper corpus remains specified and unexecuted; earlier Python-run peer receipts do not accept these tasks."
