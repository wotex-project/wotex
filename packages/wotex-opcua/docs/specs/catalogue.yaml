  - id: "WOP.02"
    version: "2.0.12"
    path: "docs/specs/WOP.02-implemented-profile.md"
    implementation_status: "implemented"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7", "claim": "explicitly selected partial native persistent/one-shot read, Write, Call and bounded child Browse client and persistent-only Value data-change subscriptions; typed and child-list pagination have deterministic response fixtures and same-stack secure C peer wire evidence; full native profile unaccepted"}, {"name": "W3C WoT Thing Description 1.1", "revision": "Recommendation 2023-12-05", "claim": "Inherited core values/operation vocabulary; package profile is not W3C conformance"}]
    requires: ["WOP.01", "wotex:WTX.02", "wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.OPCUA.Error", "Wotex.OPCUA.Mapping", "Wotex.OPCUA.Transport", "Wotex.OPCUA.Value", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.Browse", "Wotex.OPCUA.Browse.Page", "Wotex.OPCUA.Subscription"]
    executable_evidence: ["test/wotex/opcua/binary_test.exs", "test/wotex/opcua/contract_test.exs", "test/wotex/opcua/dependency_security_test.exs", "test/wotex/opcua/mapping_test.exs", "test/wotex/opcua/port_test.exs", "test/wotex/opcua/value_test.exs", "test/wotex/opcua/open62541_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/interop/native_secure_test.exs", "test/interop/native_paged_test.exs", "test/interop/native_subscription_test.exs"]
    compatibility_classification: "The explicitly selected native client has bounded persistent/one-shot read, Write and Call evidence against one independent secure peer, including typed ByteString array Write/readback. Persistent typed Browse preserves seven reference fields, remote identities, bound continuation handles, original deadline and cumulative limits. A secure same-stack C peer proves typed BrowseNext/release and persistent/one-shot child-list pagination over the wire. One-shot Read/Write/Call success shapes retain the recorded contract. Runtime ByteString Forms preserve raw scalar bytes and support explicit bounded flat-array Write/readback with ordered binary elements. Finite native pre-I/O mutation rejections retain no effect. Persistent native subscriptions deliver initial and fresh Value reports, cancel with independent-peer subscription and MonitoredItem counters returning to zero, recover a withheld notification once through independent-peer Republish, end once on receiver overflow or death, unavailable Republish or peer StatusChange and surface same-stack queue overflow InfoBits; peer lifetime expiry, Runtime observation and lifecycle stress remain unaccepted. Complete P02/S02, independent-peer pagination, error/lifecycle compatibility and software completion remain unaccepted."
  - id: "WOP.10"
    version: "1.1.2"
    path: "docs/specs/WOP.10-software-contract.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Typed-value projection, one independent-peer secure native open/read/write/call/browse/close slice and persistent Value data-change subscriptions; complete Session, subscription recovery and service requirements remain unaccepted"}]
    requires: ["WOP.00", "WOP.01", "WOP.02"]
    implementation_modules: ["Wotex.OPCUA.Address", "Wotex.OPCUA.Binary", "Wotex.OPCUA.Client", "Wotex.OPCUA.Error", "Wotex.OPCUA.Frame", "Wotex.OPCUA.PortCall", "Wotex.OPCUA.Session", "Wotex.OPCUA.Subscription", "Wotex.OPCUA.Value", "Wotex.OPCUA"]
    executable_evidence: ["test/wotex/opcua/typed_values_test.exs", "test/wotex/opcua/standalone_contract_test.exs", "priv/native/value_check.c", "priv/native/value_fault_check.c", "priv/native/native_contract_check.c", "test/wotex/opcua/native/build_test.exs", "test/wotex/opcua/port_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/interop/native_subscription_test.exs"]
    compatibility_classification: "WOP-P01 accepts S01 typed values and the exact WOP-F01..F13/WOP-X-F01..F16 pure/native projections. P02 slices activate one secure peer Session, acquire NamespaceArray and perform one-at-a-time typed Value Read/Write/Call and bounded one-page child Browse with concrete input namespace translation and no mutation retry; no complete S02 or additional fixture family is accepted. S05 health_check/2 returns ok only after a concrete Read probe succeeds (independent-peer success and missing-node failure). S04 persistent Value subscriptions validate the closed request map before I/O, return an opaque handle after checked revisions and deliver ordered reports with C05 receiver bounds against the independent peer, including one-time Republish recovery, unavailable-Republish and StatusChange termination; a same-stack peer proves overflow metadata. Peer lifetime expiry, other services, lifecycle and the security matrix remain required."
  - id: "WOP.11"
    version: "1.1.13"
    path: "docs/specs/WOP.11-standalone-client-and-preservation.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Pure typed value/identity/reference subset, persistent Browse handles and same-stack secure BrowseNext/release wire evidence; no independent BrowseNext acceptance"}]
    requires: ["WOP.00", "WOP.10"]
    implementation_modules: ["Wotex.OPCUA.Binary", "Wotex.OPCUA.Binary.Names", "Wotex.OPCUA.Binary.Reference", "Wotex.OPCUA.Binary.Variant", "Wotex.OPCUA.Binary.DataValue", "Wotex.OPCUA.Binary.Element", "Wotex.OPCUA.Browse", "Wotex.OPCUA.Browse.Page"]
    executable_evidence: ["test/wotex/opcua/standalone_contract_test.exs", "test/wotex/opcua/binary/names_test.exs", "test/wotex/opcua/binary/reference_test.exs", "test/wotex/opcua/typed_values_test.exs", "test/wotex/opcua/open62541_test.exs", "test/interop/native_paged_test.exs"]
    compatibility_classification: "WOP-P01 accepts F01 through F13 through pure typed value/identity/reference codecs with boundary and malformed-input tests. Partial native child Browse and typed reference pages have independent single-page evidence; typed pagination, release and persistent/one-shot child collection have same-stack secure C peer wire evidence. Up to 64 live continuations per Session and deadline-driven automatic release have native state, deterministic probe and same-stack wire evidence. Independent-peer BrowseNext/release (the pinned asyncua peer has no BrowseNext), WOP-F14..F16 lifecycle bindings, full Session and lifecycle cases remain required."
  - id: "WOP.12"
    version: "1.1.6"
    path: "docs/specs/WOP.12-wotex-integration.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Selected native one-shot ByteString Runtime Form scalar and flat-array Write/readback paths have independent-peer evidence; full integration remains unaccepted"}, {"name": "W3C WoT Thing Description 1.1", "revision": "Recommendation 2023-12-05", "claim": "Inherited core values/operation vocabulary; package profile is not W3C conformance"}]
    requires: ["WOP.00", "WOP.10", "WOP.11", "wotex:WTX.01", "wotex:WTX.02", "wotex:WTX.03", "wotex_runtime:WRT.01"]
    implementation_modules: ["Wotex.OPCUA.Mapping", "Wotex.OPCUA.Transport", "Wotex.OPCUA.Value", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.RuntimeRelay", "Wotex.OPCUA.RuntimeHandle"]
    executable_evidence: ["test/wotex/opcua/open62541_test.exs", "test/interop/native_secure_test.exs", "test/wotex/opcua/runtime_stream_test.exs", "test/interop/native_runtime_stream_test.exs", "test/wotex/opcua/runtime_integration_test.exs"]
    compatibility_classification: "One explicitly selected native one-shot Runtime ByteString Form path preserves raw scalar bytes and supports typed flat-array Write/readback/restore with ordered bounded binary elements. Runtime observeproperty runs through a relay owned by the real Runtime subscription process: ConsumedThing child specifications deliver independent-peer Double and ByteString values with observation metadata, stop and owner death return the peer's subscription counts to zero, and peer subscription loss reaches the receiver as session_lost; subscribeevent and one-shot configurations acquire no peer subscription. I04 error classes pass the complete table through ConsumedThing and Runtime.Retry. The I02 static one-shot and session profiles reject supplied contentType before I/O and project persistent Read/Write results; the integration corpus executes WOP-I-F01..F07, and both production profiles read, write and observe against the independent peer. The archive consumer, minimum runtime matrix and remaining I03/I05/I06 cells remain unaccepted."
  - id: "WOP.13"
    version: "1.1.32"
    path: "docs/specs/WOP.13-native-executable.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541 / OpenSSL", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Pinned static build, executable admission, custody, SDK value projection and secure native open/read/write/call/browse/close; BrowseNext/release have same-stack secure C peer wire evidence but no independent peer acceptance; full Session/service interoperability remains unaccepted"}]
    requires: ["WOP.00", "WOP.10", "WOP.11", "WOP.12"]
    implementation_modules: ["Wotex.OPCUA.Native.Build", "Wotex.OPCUA.Native.Source", "Wotex.OPCUA.Native.Archive", "Wotex.OPCUA.Native.Workspace", "Wotex.OPCUA.Native.Host", "Wotex.OPCUA.Native.HostOptions", "Wotex.OPCUA.Native.Config", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.Native.Executable", "Wotex.OPCUA.Native.Ready", "Wotex.OPCUA.Native.Frame", "Wotex.OPCUA.Native.Vendor"]
    executable_evidence: ["test/wotex/opcua/native/build_test.exs", "test/wotex/opcua/native/build_fault_test.exs", "test/wotex/opcua/native/custody_test.exs", "bin/check_native_custody.exs", "priv/native/custody_check.c", "priv/native/value_check.c", "priv/native/value_fault_check.c", "priv/native/native_contract_check.c", "priv/native/ipc_check.c", "priv/native/output_check.c", "priv/native/owner_check.c", "priv/native/publish_sequence_check.c", "priv/native/subscription_check.c", "priv/native/security_check.c", "priv/native/sdk_revision_check.c", "priv/native/browse_check.c", "priv/native/namespace_check.c", "priv/native/paged_peer.c", "test/interop/native_paged_test.exs", "test/interop/native_secure_test.exs", "test/interop/native_lifecycle_test.exs", "test/interop/native_subscription_test.exs", "test/wotex/opcua/subscription_lifecycle_test.exs", "test/interop/security_fault_test.exs", "test/interop/secure_peer.py", "test/wotex/opcua/native/config_test.exs", "test/wotex/opcua/open62541_test.exs", "priv/native/session_probe.c", "test/wotex/opcua/native/frame_test.exs", "test/wotex/opcua/native/ready_test.exs", "test/wotex/opcua/native/executable_test.exs", "test/wotex/opcua/native/host_options_test.exs", "test/wotex/opcua/native/host_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/native/owner_fixture.c", "test/wotex/opcua/native/json_test.exs", "test/wotex/opcua/native/vendor_test.exs"]
    compatibility_classification: "WOP-P00 accepts static native build, source/executable admission, bounded BEAM readiness and portable bidirectional custody for its exact evidence cohorts, including Linux sanitizer and leak lanes. WOP-P01 additionally accepts production parser/SDK value projection and a pure exact-match namespace translator for WOP-X-F01..F16. P02 slices encode owner-side frames/deadlines and credit, queue normal native output behind that credit in a bounded nonblocking queue, multiplex up to 64 native operations with request-scoped failures, nonblocking cancel and health through an injectable service boundary (binding WOP-X-F17..F20, F49, F50 and F52..F55 with an injected service), validate open shape and credentials, then activate, read, write, call, browse and close one secure native Session against an independent Basic256Sha256 anonymous peer. The executable checks the revised timeout and server NamespaceArray, translates concrete input NodeIds through the SDK namespace map and returns a typed Value DataValue, individual Write status or ordered Call result. The BEAM owner correlates responses, replenishes consumed credit and preserves unknown mutation effect after transmitted failure. This binds no additional native-contract case and does not accept full P02/P03. A digest-checked SDK patch preserves the actual revised Session timeout and keeps pinned endpoint discovery on a secure channel. C-generated key/trust/SAN/URI/CRL, policy and token configuration vectors and a separate C probe provide prerequisite evidence. An explicitly selected public native client now uses bounded credential snapshots for persistent and one-shot secure Sessions, with independent ByteString array Write/readback, child Browse and one-shot Read/Write/Call success projection. A secure same-stack C peer proves BrowseNext/release and persistent/one-shot child-list pagination over the wire; its compatibility and service matrix remains partial. The facade preserves finite local mutation rejection as no-effect while uncertain failures remain unknown. BEAM-host concurrent admission, caller-timeout/caller-death cancellation and per-request terminal effects (WOP-X-F20, F22, F51, F56, F57) are implemented with process-fixture and deterministic probe evidence and 32 concurrent callers against the independent peer. Identity-bearing values are projected between SDK-local and server namespace indexes (native namespace_check with a reordered table and independent-peer NodeId/QualifiedName Write/readback). The public persistent client admits Read/Write/Call from any process (32 concurrent processes against the independent peer), and a counter-bearing same-stack peer proves explicit Session deletion and open-phase owner-death release. The three SignAndEncrypt policies with anonymous, username and certificate tokens execute Read/Write/Call/Browse/subscribe/unsubscribe/close against the independent peer with peer subscription and MonitoredItem counters returning to zero (X-F30..F38 bound with peer subscription, continuation and local process counts) and X-F39..F47 rejections fail closed. The BEAM host routes validated subscription reports to monitored receivers with receiver-queue bounds, late-subscribe cancellation and terminal-once delivery. Output written before native exit is handled in order, owner death notifies unanswered callers and receivers once, and a suspended owner under a continuous same-stack report producer receives exactly 16 credited reports before one receiver_overflow with native processes and the server Session released. Other native services, report buffering, cancellation and the full independent-peer matrix remain required implementation."
