    compatibility_classification: "WOP-P01 accepts S01 typed values and the exact WOP-F01..F13/WOP-X-F01..F16 pure/native projections. P02 slices activate one secure peer Session, acquire NamespaceArray and perform one-at-a-time typed Value Read/Write/Call and bounded one-page child Browse with concrete input namespace translation and no mutation retry; no complete S02 or additional fixture family is accepted. Other services, lifecycle, security matrix and subscriptions remain required."
