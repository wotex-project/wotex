    compatibility_classification: "The explicitly selected native client has bounded persistent/one-shot read, Write and Call evidence against one independent secure peer, including typed ByteString array Write/readback. Persistent typed Browse preserves seven reference fields, remote identities, bound continuation handles, original deadline and cumulative limits. A secure same-stack C peer proves typed BrowseNext/release and persistent/one-shot child-list pagination over the wire. One-shot Read/Write/Call success shapes retain the recorded contract. Runtime ByteString Forms preserve raw scalar bytes and support explicit bounded flat-array Write/readback with ordered binary elements. Finite native pre-I/O mutation rejections retain no effect. Complete P02/S02, independent-peer pagination, error/lifecycle compatibility and software completion remain unaccepted."
