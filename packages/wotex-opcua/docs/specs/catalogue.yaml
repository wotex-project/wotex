    compatibility_classification: "WOP-P00 accepts static native build, source/executable admission, bounded BEAM readiness and portable bidirectional custody for its exact evidence cohorts, including Linux sanitizer and leak lanes. WOP-P01 additionally accepts production parser/SDK value projection and a pure exact-match namespace translator for WOP-X-F01..F16. Initial P02 slices encode owner-side frames/deadlines and initial credit, validate outer requests/open shape and native credentials, and correlate one terminal-only exchange in the real executable; they admit no service and bind no further native-contract case. A digest-checked SDK patch preserves the actual revised Session timeout and keeps pinned endpoint discovery on a secure channel. Native credential preflight and SDK configuration have C-generated key/trust/SAN/URI/CRL, policy and token vectors; a separate C probe activates one Basic256Sha256 anonymous Session with an independent peer and reads its NamespaceArray. Normal output credit, production native Session, services and the full independent-peer matrix remain required implementation."
