  - id: "WOP.13"
    version: "1.1.24"
    path: "docs/specs/WOP.13-native-executable.md"
    implementation_status: "partial"
    standards: [{"name": "OPC UA / open62541 / OpenSSL", "revision": "OPC 10000 Parts 4/6 1.05.07; open62541 1.5.7; OpenSSL 3.5.8", "claim": "Pinned static build, executable admission, custody, SDK value projection and secure native open/read/write/call/browse/close; BrowseNext/release have same-stack secure C peer wire evidence but no independent peer acceptance; full Session/service interoperability remains unaccepted"}]
    requires: ["WOP.00", "WOP.10", "WOP.11", "WOP.12"]
    implementation_modules: ["Wotex.OPCUA.Native.Build", "Wotex.OPCUA.Native.Source", "Wotex.OPCUA.Native.Archive", "Wotex.OPCUA.Native.Workspace", "Wotex.OPCUA.Native.Host", "Wotex.OPCUA.Native.HostOptions", "Wotex.OPCUA.Native.Config", "Wotex.OPCUA.Open62541", "Wotex.OPCUA.Native.Executable", "Wotex.OPCUA.Native.Ready", "Wotex.OPCUA.Native.Frame", "Wotex.OPCUA.Native.Vendor"]
    executable_evidence: ["test/wotex/opcua/native/build_test.exs", "test/wotex/opcua/native/build_fault_test.exs", "test/wotex/opcua/native/custody_test.exs", "bin/check_native_custody.exs", "priv/native/custody_check.c", "priv/native/value_check.c", "priv/native/value_fault_check.c", "priv/native/native_contract_check.c", "priv/native/ipc_check.c", "priv/native/output_check.c", "priv/native/owner_check.c", "priv/native/security_check.c", "priv/native/sdk_revision_check.c", "priv/native/browse_check.c", "priv/native/namespace_check.c", "priv/native/paged_peer.c", "test/interop/native_paged_test.exs", "test/interop/native_secure_test.exs", "test/wotex/opcua/native/config_test.exs", "test/wotex/opcua/open62541_test.exs", "priv/native/session_probe.c", "test/wotex/opcua/native/frame_test.exs", "test/wotex/opcua/native/ready_test.exs", "test/wotex/opcua/native/executable_test.exs", "test/wotex/opcua/native/host_options_test.exs", "test/wotex/opcua/native/host_test.exs", "test/wotex/opcua/persistent_bridge_test.exs", "test/native/owner_fixture.c", "test/wotex/opcua/native/json_test.exs", "test/wotex/opcua/native/vendor_test.exs"]
    compatibility_classification: "WOP-P00 accepts static native build, source/executable admission, bounded BEAM readiness and portable bidirectional custody for its exact evidence cohorts, including Linux sanitizer and leak lanes. WOP-P01 additionally accepts production parser/SDK value projection and a pure exact-match namespace translator for WOP-X-F01..F16. P02 slices encode owner-side frames/deadlines and credit, queue normal native output behind that credit in a bounded nonblocking queue, multiplex up to 64 native operations with request-scoped failures, nonblocking cancel and health through an injectable service boundary (binding WOP-X-F17..F20, F49, F50 and F52..F55 with an injected service), validate open shape and credentials, then activate, read, write, call, browse and close one secure native Session against an independent Basic256Sha256 anonymous peer. The executable checks the revised timeout and server NamespaceArray, translates concrete input NodeIds through the SDK namespace map and returns a typed Value DataValue, individual Write status or ordered Call result. The BEAM owner correlates responses, replenishes consumed credit and preserves unknown mutation effect after transmitted failure. This binds no additional native-contract case and does not accept full P02/P03. A digest-checked SDK patch preserves the actual revised Session timeout and keeps pinned endpoint discovery on a secure channel. C-generated key/trust/SAN/URI/CRL, policy and token configuration vectors and a separate C probe provide prerequisite evidence. An explicitly selected public native client now uses bounded credential snapshots for persistent and one-shot secure Sessions, with independent ByteString array Write/readback, child Browse and one-shot Read/Write/Call success projection. A secure same-stack C peer proves BrowseNext/release and persistent/one-shot child-list pagination over the wire; its compatibility and service matrix remains partial. The facade preserves finite local mutation rejection as no-effect while uncertain failures remain unknown. BEAM-host concurrent admission, caller-timeout/caller-death cancellation and per-request terminal effects (WOP-X-F20, F22, F51, F56, F57) are implemented with process-fixture and deterministic probe evidence and 32 concurrent callers against the independent peer. Identity-bearing values are projected between SDK-local and server namespace indexes (native namespace_check with a reordered table and independent-peer NodeId/QualifiedName Write/readback). Other native services, public multi-caller facade use, report buffering, cancellation and the full independent-peer matrix remain required implementation."
