    compatibility_classification: "WOP-P01 accepts F01 through F13 through pure typed value/identity/reference codecs with boundary and malformed-input tests. Partial native child Browse and typed reference pages have independent single-page evidence; typed pagination, release and persistent/one-shot child collection have same-stack secure C peer wire evidence. Multiple live continuations, independent-peer BrowseNext/release, full Session and lifecycle cases remain required."
