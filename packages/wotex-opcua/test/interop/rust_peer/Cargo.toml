[package]
name = "wotex-opcua-rust-peer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
async-opcua = { version = "=0.19.0", features = ["server"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }

[patch.crates-io]
async-opcua-nodes = { path = "vendor/async-opcua-nodes" }
async-opcua-server = { path = "vendor/async-opcua-server" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
