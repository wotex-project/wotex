name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.0"
            otp: "28.0"
            artifact: false
          - elixir: "1.19.5"
            otp: "28.5"
            artifact: true
    defaults:
      run:
        working-directory: wotex-directory
    env:
      MIX_ENV: test
      WOTEX_PATH_DEPS: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: wotex-directory
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: wotex-project/wotex
          ref: fb7d0c85b598b90c2bab268b1d811353485c1f06
          path: wotex
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            wotex-directory/deps
            wotex-directory/_build
            wotex-directory/priv/plts
          key: directory-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('wotex-directory/mix.lock') }}
      - run: mix deps.get --only test
      - run: mix check
      - if: matrix.artifact
        run: mix coveralls.lcov
      - if: matrix.artifact
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: wotex-directory/cover/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: matrix.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wotex-directory-hex
          path: wotex-directory/wotex_directory-*.tar
          if-no-files-found: error
